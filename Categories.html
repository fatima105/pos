<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories</title>

    <!-- Bootstrap CSS -->
     <link href="scripts/bootstrap.min.css" rel="stylesheet" />

    <!-- DataTables CSS -->
 <!-- Local DataTables CSS -->
<link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
<link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />


    <style>
      /* Background color only for button container */
      .bg-buttons {
        background-color: #6c757d; /* Bootstrap secondary gray */
        color: #e9ecef;
        outline: none !important; /* Ensures no outline */
        border: none !important; /* Removes border */
        box-shadow: none !important; /* Ensures no shadow effect */
      }

      .bg-buttons .btn {
        background-color: #6c757d; /* Bootstrap secondary gray */
        color: #e9ecef;
        outline: none !important; /* Ensures no outline */
        border: none !important; /* Removes border */
        box-shadow: none !important; /* Ensures no shadow effect */
      }
    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-white py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Categories</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item active text-muted" aria-current="page">
                  Categories
                </li>
              </ol>
            </nav>
          </div>
    <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <div class="card shadow-lg mt-5">
            <div class="container mt-4 mb-4">
              <div class="container mt-3">
            
                <div class="d-flex justify-content-end">
                  <a href="add-category.html" class="text-decoration-none btn btn-primary btn-sm d-flex align-items-center px-3 py-2">
                    <i class="fa-solid fa-plus me-1"></i> Add Category
                  </a>
                </div>
                <hr class="mt-2">
              </div>
          
              <table id="categoryTable" class="table table-striped table-bordered mt-5">
                <thead class="table-light text-dark">
                  <tr>
                    <th>No</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="categoryTableBody">
                    <!-- Rows will be populated here -->
                  </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>

    <!-- jQuery -->


    <!-- DataTables Core -->
   <!-- DataTables -->
 <script src="scripts/jquery.dataTables.min.js"></script>
<script src="scripts/dataTables.buttons.min.js"></script>
<script src="scripts/jszip.min.js"></script>
<script src="scripts/pdfmake.min.js"></script>
<script src="scripts/vfs_fonts.js"></script>
<script src="scripts/buttons.html5.min.js"></script>
<script src="scripts/buttons.print.min.js"></script>
   
    <!-- Buttons Dependencies -->
  
    <!-- Bootstrap JS -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
 <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
      const apiUrl = `${BASEURL}Category`;
    
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          const tbody = document.getElementById('categoryTableBody');
          tbody.innerHTML = ''; // Clear existing rows
    
          if (data.Category && data.Category.length > 0) {
            data.Category.forEach((category, index) => {
              const row = `
                <tr>
                  <td>${index + 1}</td>
                  <td>${category.name}</td>
                  <td>${category.description}</td>
                  <td>
                    ${category.status === 'Active' 
                      ? ` 
                        <span class="badge text-dark d-flex align-items-center">
                          <button class="btn btn-sm btn-success rounded-circle me-1">
                            <i class="fa-solid fa-check"></i>
                          </button>
                          Active
                        </span>` 
                      : `
                        <span class="badge text-dark d-flex align-items-center">
                          <button class="btn btn-sm btn-danger rounded-circle me-1">
                            <i class="fa-solid fa-ban"></i>
                          </button>
                          Block
                        </span>`
                    }
                  </td>
                  <td>
                    <div class="d-flex gap-2">
                      <a href="edit-category.html?id=${category.id}" class="btn btn-sm">
                        <i style="color:blue;" class="fas fa-edit"></i>
                      </a>
                    </div>
                  </td>
                </tr>
              `;
              tbody.insertAdjacentHTML('beforeend', row);
            });
          } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">No data found</td></tr>';
          }

          // Re-initialize DataTable after data has been inserted
          $('#categoryTable').DataTable({
            dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
            buttons: [
              { extend: "copy", className: "btn btn-sm" },
              { extend: "csv", className: "btn btn-sm" },
              { extend: "excel", className: "btn btn-sm" },
              { extend: "pdf", className: "btn btn-sm" },
              { extend: "print", className: "btn btn-sm" },
            ],
          });
        })
        .catch(error => {
          console.error('Error fetching category data:', error);
        });
    
      document.addEventListener("DOMContentLoaded", function () {
        // Load Footer
        fetch("scripts/footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer-container").innerHTML = data;
            document.getElementById("year").textContent = new Date().getFullYear();
          })
          .catch((error) => console.error("Error loading footer:", error));

        // Load Sidebar
        fetch("sidebar.html")
          .then((response) => response.text())
          .then(
            (html) =>
              (document.getElementById("sidebar-container").innerHTML = html)
          );
      });
    </script>
  </body>
</html>

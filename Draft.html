<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Draft Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
   <link href="scripts/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap CSS -->

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
  <style>
    body {
      background-color: #f9f9f9;
      font-family: "Segoe UI", sans-serif;
    }
    .accordion-button:not(.collapsed) {
      background-color: #0d6efd;
      color: white;
    }
    .nav-icon {
      font-size: 1.1rem;
    }


.action-buttons {
  margin-left: auto; /* This pushes the buttons to the right */
  display: flex;
  gap: 0.5rem;
}


    .table td, .table th {
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="container-fluid ">
  <!-- NAVIGATION ROW -->
  <div class="row g-2 m-0 mb-4">
    <div class="col-6 col-sm-4 col-md-2 col-lg-1">
      <a class="btn border border-success w-100 rounded-3 d-flex align-items-center justify-content-center gap-2" href="index.html">
        <i class="fa-solid fa-home nav-icon"></i>
        <span>Home</span>
      </a>
    </div>
    <div class="col-6 col-sm-4 col-md-2 col-lg-1">
      <a class="btn border border-success w-100 rounded-3 d-flex align-items-center justify-content-center gap-2" href="sale-register.html">
        <i class="fa-solid fa-database nav-icon"></i>
        <span>Sales</span>
      </a>
    </div>
    <div class="col-6 col-sm-4 col-md-2 col-lg-1">
      <a class="btn border border-success w-100 rounded-3 d-flex align-items-center justify-content-center gap-2" href="#">
        <i class="fa-solid fa-cash-register nav-icon"></i>
        <span>Cashier</span>
      </a>
    </div>
    <div class="col-6 col-sm-4 col-md-2 col-lg-1">
      <a class="btn border border-success w-100 rounded-3 d-flex align-items-center justify-content-center gap-2" href="#">
        <i class="fa-solid fa-file-invoice nav-icon"></i>
        <span>Sales Return</span>
      </a>
    </div>
    <div class="col-6 col-sm-4 col-md-2 col-lg-1">
      <a class="btn border border-success w-100 rounded-3 d-flex align-items-center justify-content-center gap-2" href="Draft.html">
        <i class="fa-solid fa-file-invoice nav-icon"></i>
        <span>Drafts</span>
      </a>
    </div>
  </div>

   <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

  <div class="text-center mb-4">
    <h2><i class="bi bi-clipboard-data"></i> Draft Orders by Session</h2>
 </div>

  <!-- ACCORDION -->
  <div class="accordion" id="draftAccordion">
    <!-- JS will populate content here -->
  </div>
</div>

<!-- Bootstrap JS -->
<script src="config.js"></script>
    <!-- Bootstrap JS -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
 <script src="scripts/bootstrap.bundle.min.js"></script>
<script>
fetch(`${BASEURL}Order/GetAll`)
  .then(res => res.json())
  .then(data => {
    const accordion = document.getElementById("draftAccordion");

    // ✅ Check if drafts array is empty
    if (!data.drafts || data.drafts.length === 0) {
      accordion.innerHTML = `
        <div class="alert alert-info text-center my-3">
          🛒 <strong>No Orders Are Pending</strong>
        </div>
      `;
      return; // Exit early
    }

    const grouped = {};
    data.drafts.forEach(item => {
      const session = item.order_session || "No Session";
      if (!grouped[session]) grouped[session] = [];
      grouped[session].push(item);
    });

    let index = 0;

    for (const session in grouped) {
      const sessionData = grouped[session];
      const sessionId = `collapse-${index}`;

      const rows = sessionData.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><strong>${item.product_name || "-"}</strong></td>
          <td>${item.quantity}</td>
          <td>${item.unit_name || "-"}</td>
          <td>Rs. ${item.retail.toLocaleString()}</td>
          <td>${item.discount}%</td>
          <td><span class="badge bg-secondary">${item.status}</span></td>
          <td>${new Date(item.created_at).toLocaleString()}</td>
        </tr>
      `).join("");

      accordion.innerHTML += `
        <div class="accordion-item shadow-sm">
          <h2 class="accordion-header" id="heading-${index}">
            <button class="accordion-button ${index !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#${sessionId}" aria-expanded="${index === 0 ? 'true' : 'false'}">
              <div class="session-header w-100 d-flex justify-content-between align-items-center">
               <span>📝 Draft Name: <code>${sessionData[0].draft_name || session}</code></span>

                <div class="d-flex">
                  <div class="ms-auto">
                    <button class="btn btn-sm btn-outline-primary" onclick="continueDraft('${session}')">
                      <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSession('${session}')">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </button>
          </h2>
          <div id="${sessionId}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}" data-bs-parent="#draftAccordion">
            <div class="accordion-body">
              <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>#</th>
                      <th>Product</th>
                      <th>Qty</th>
                      <th>Unit</th>
                      <th>Retail</th>
                      <th>Discount</th>
                      <th>Status</th>
                      <th>Created At</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
      index++;
    }
  })
  .catch(err => {
    document.getElementById("draftAccordion").innerHTML = `
      <div class="alert alert-danger text-center">Failed to load drafts. Please try again.</div>
    `;
    console.error(err);
  });

function deleteSession(sessionId) {
  if (confirm(`Are you sure you want to delete all drafts for session: ${sessionId}?`)) {
    fetch(`${BASEURL}Order/Delete`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ order_session: sessionId })
    })
    .then(res => res.json())
    .then(result => {
      if (result.success) {
   localStorage.setItem('globalAlertMessage',`${result.message}`);
localStorage.setItem('globalAlertType', 'success');
    
        location.reload();
      } else {
      localStorage.setItem('globalAlertMessage',`${result.message}`);
localStorage.setItem('globalAlertType', 'danger');
      }
    })
    .catch(err => {
      console.error(err);
        localStorage.setItem('globalAlertMessage',`Something went wrong`);
localStorage.setItem('globalAlertType', 'danger');
    });
  }
}

function continueDraft(session) {
  window.location.href = `sale-register.html?session_id=${session}`;
}
</script>


</body>
</html>

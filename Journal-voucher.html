<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash Journal Payment</title>

    <!-- Bootstrap CSS -->
    <link href="scripts/bootstrap.min.css" rel="stylesheet" />

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />

    <style>
      .bg-buttons {
        background-color: #6c757d;
        color: #e9ecef;
        outline: none !important;
        border: none !important;
        box-shadow: none !important;
      }

      .bg-buttons .btn {
        background-color: #6c757d;
        color: #e9ecef;
        outline: none !important;
        border: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>

  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-white py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Cash Journal Payment</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item active text-muted" aria-current="page">
                  Cash Journal Payment
                </li>
              </ol>
            </nav>
          </div>

          <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <div class="card shadow-lg mt-5">
            <div class="container mt-4 mb-4">
              <div class="d-flex justify-content-end mb-3">
                <a href="add-cash-journal-payment.html" class="btn btn-primary btn-sm d-flex align-items-center px-2 py-2">
                  <i class="fa-solid fa-plus me-1"></i> Add Cash Journal Payment
                </a>
              </div>
              <hr class="mt-2" />

              <table id="journalpayment" class="table table-striped table-bordered mt-4">
                <thead class="table-light text-dark">
                  <tr>
                    <th>Code</th>
                    <th>Date</th>
                    <th>Remarks</th>
                    <th>Amount</th>
               
                    <th>Added By</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this journal voucher?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>

    <!-- JS Libraries -->
    <script src="scripts/jquery-3.6.0.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="scripts/jquery.dataTables.min.js"></script>
    <script src="scripts/dataTables.buttons.min.js"></script>
    <script src="scripts/jszip.min.js"></script>
    <script src="scripts/pdfmake.min.js"></script>
    <script src="scripts/vfs_fonts.js"></script>
    <script src="scripts/buttons.html5.min.js"></script>
    <script src="scripts/buttons.print.min.js"></script>
    <script src="config.js"></script>

<script>
let selectedId = null;

// When trash icon is clicked
$(document).on('click', '.open-delete-modal', function () {
  selectedId = $(this).data('id');
  $('#deleteModal').modal('show');
});

// Confirm delete
$('#confirmDeleteBtn').on('click', function () {
  if (!selectedId) return;

  fetch(`${BASEURL}CashJournalVoucher/${selectedId}`, { method: 'DELETE' })
    .then(res => res.json())
    .then(data => {
      console.log(data);
      $('#deleteModal').modal('hide');
      showInlineAlert('Deleted successfully');
      location.reload();
    })
    .catch(err => {
      console.error(err);
      showInlineAlert('Failed to delete', 'danger');
    });
});

function showInlineAlert(message, type = 'info') {
  const alertPlaceholder = document.getElementById('alertPlaceholder');
  const alertHTML = `
    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${message}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  `;
  alertPlaceholder.innerHTML = alertHTML;
  setTimeout(() => {
    const alert = alertPlaceholder.querySelector('.alert');
    if (alert) alert.classList.remove('show');
  }, 5000);
}

async function loadjournalpaymentData() {
  const url = `${BASEURL}CashJournalVoucher`;

  try {
    const response = await fetch(url, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });

    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

    const result = await response.json();
    console.log("API Response:", result);

    window.journalpayment.clear();

    const journalpaymentArray = Array.isArray(result.data) ? result.data : [];

    journalpaymentArray.forEach(cp => {
      window.journalpayment.row.add([
        cp.code || "",
        cp.date ? new Date(cp.date).toLocaleDateString() : "",
        cp.narration,
        cp.credit,
        cp.user_id || "",
        `
          <div class="d-flex gap-2">
            <a href="specific-voucher-cash-journal.html?id=${cp.id}" class="btn btn-sm">
              <i class="fas fa-eye" style="color:blue;"></i>
            </a>
            <button class="btn btn-sm open-delete-modal" data-id="${cp.id}">
              <i class="fas fa-trash" style="color:red;"></i>
            </button>
          </div>
        `
      ]);
    });

    window.journalpayment.draw();

  } catch (error) {
    console.error("Error fetching journalpayment:", error);
    showInlineAlert("Failed to load Cash Journal Payment data.", "danger");
  }
}

document.addEventListener("DOMContentLoaded", function () {

  // ✅ Load Sidebar inside async IIFE
  (async () => {
    try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
      $("#sidebar-container").html(sidebarHTML);

      // Load sidebar script dynamically
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js";
      sidebarScript.onload = () => {
        if (typeof initSidebar === "function") initSidebar();
      };
      document.body.appendChild(sidebarScript);
    } catch (err) {
      console.error("Error loading sidebar:", err);
    }
  })();

  // ✅ Load Footer
  fetch("scripts/footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("footer-container").innerHTML = html;
      const yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    });

  // ✅ Initialize DataTable
  window.journalpayment = $("#journalpayment").DataTable({
    dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
    buttons: [
      { extend: "copy", className: "btn btn-sm" },
      { extend: "csv", className: "btn btn-sm" },
      { extend: "excel", className: "btn btn-sm" },
      { extend: "pdf", className: "btn btn-sm" },
      { extend: "print", className: "btn btn-sm" },
    ],
    order: []
  });

  // ✅ Load data
  loadjournalpaymentData();
});
</script>

  </body>
</html>

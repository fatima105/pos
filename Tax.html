<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax</title>

    <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />

    <!-- DataTables CSS -->
<!-- Local DataTables CSS -->
<link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
<link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* Background color only for button container */
      .bg-buttons {
        background-color: #6c757d; /* Bootstrap secondary gray */
        color: #e9ecef;
        outline: none !important; /* Ensures no outline */
        border: none !important; /* Removes border */
        box-shadow: none !important; /* Ensures no shadow effect */
      }

      .bg-buttons .btn {
        background-color: #6c757d; /* Bootstrap secondary gray */
        color: #e9ecef;
        outline: none !important; /* Ensures no outline */
        border: none !important; /* Removes border */
        box-shadow: none !important; /* Ensures no shadow effect */
      }
    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-white py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Taxes</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item active text-muted" aria-current="page">
                  Taxes
                </li>
              </ol>
            </nav>
          </div>
     <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <div class="card shadow-lg mt-5">
            <div class="container mt-4 mb-4">
              <div class="container mt-3">
                <div class="d-flex justify-content-end">
                  <a href="add-tax.html" class="text-decoration-none btn btn-primary btn-sm d-flex align-items-center px-3 py-2">
                    <i class="fa-solid fa-plus me-1"></i> Add Tax
                  </a>
                </div>
                <hr class="mt-2">
              </div>
       
              <table id="taxTable" class="table table-striped table-bordered mt-5">
                <thead class="table-light text-dark">
                  <tr>
                    <th>No</th>
                    <th>Name</th>
                    <th>Tax Rate</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="taxTableBody">
                  <!-- Rows will be populated here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this tax record?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
          </div>
        </div>
      </div>
    </div>
    <script src="scripts/sweetalert.min.js"></script>
 <script src="config.js"></script>
    <!-- jQuery -->
    

   <!-- DataTables -->
 <script src="scripts/jquery.dataTables.min.js"></script>
<script src="scripts/dataTables.buttons.min.js"></script>
<script src="scripts/jszip.min.js"></script>
<script src="scripts/pdfmake.min.js"></script>
<script src="scripts/vfs_fonts.js"></script>
<script src="scripts/buttons.html5.min.js"></script>
<script src="scripts/buttons.print.min.js"></script>>
    <script src="scripts/jquery-3.6.0.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>
   
    <script>
      // Replace with your actual IP and port if needed
      const apiUrl = `${BASEURL}Tax`;
    
      // Function to load taxes
      function loadTaxes() {
        fetch(apiUrl)
          .then(response => response.json())
          .then(data => {
            const tbody = document.getElementById('taxTableBody');
            tbody.innerHTML = ''; // Clear existing rows
    
            if (data.Tax && data.Tax.length > 0) {
              data.Tax.forEach((tax, index) => {
                const row = `
                  <tr>
                    <td>${index + 1}</td>
                    <td>${tax.name}</td>
                    <td>${tax.tax_rate}</td>
                    <td>
                      <div class="d-flex gap-2">
                        <a href="edit-tax.html?id=${tax.id}" class="btn btn-sm">
                          <i style="color:blue;" class="fas fa-edit"></i>
                        </a>
                        <!-- DELETE BUTTON -->
                        <button type="button" class="btn btn-sm delete-btn" data-id="${tax.id}" data-bs-toggle="modal" data-bs-target="#deleteModal">
                          <i style="color:red;" class="fas fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
              });
              
              // Add click event listeners for delete buttons
              attachDeleteEventListeners();
            } else {
              tbody.innerHTML = '<tr><td colspan="4" class="text-center">No tax records found</td></tr>';
            }
          })
          .catch(error => {
            console.error('Error fetching tax data:', error);
            document.getElementById('taxTableBody').innerHTML = 
              '<tr><td colspan="4" class="text-center text-danger">Error loading tax data</td></tr>';
          });
      }
    
      // Function to attach event listeners to delete buttons
      function attachDeleteEventListeners() {
        document.querySelectorAll('.delete-btn').forEach(button => {
          button.addEventListener('click', () => {
            const taxId = button.getAttribute('data-id');
            document.getElementById('confirmDelete').setAttribute('data-id', taxId);
          });
        });
      }
    
      document.addEventListener("DOMContentLoaded", function () {
        // Load Taxes
        loadTaxes();
    
        // Load Footer
        fetch("scripts/footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer-container").innerHTML = data;
            document.getElementById("year").textContent = new Date().getFullYear();
          })
          .catch((error) => console.error("Error loading footer:", error));
    
        // Load Sidebar
        fetch("sidebar.html")
          .then((response) => response.text())
          .then((html) => (document.getElementById("sidebar-container").innerHTML = html));
    
        // Initialize DataTable with buttons inside bg-buttons div
        $("#taxTable").DataTable({
          dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
          buttons: [
            { extend: "copy", className: "btn btn-sm" },
            { extend: "csv", className: "btn btn-sm" },
            { extend: "excel", className: "btn btn-sm" },
            { extend: "pdf", className: "btn btn-sm" },
            { extend: "print", className: "btn btn-sm" },
          ],
        });
    
        // Handle delete confirmation
        document.getElementById('confirmDelete').addEventListener('click', function() {
          const taxId = this.getAttribute('data-id');
          
          fetch(`${BASEURL}Tax/${taxId}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json'
            }
          })
          .then(response => {
            if (response.ok) {
              // Close the modal
              const deleteModal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
              deleteModal.hide();
// Reload the tax data
loadTaxes();

    // This must run after sweetalert.min.js is loaded
    swal("Deleted!", "Tax record deleted successfully!", "success");
     
              
              // Reinitialize the DataTable
              $('#taxTable').DataTable().destroy();
              setTimeout(() => {
                $("#taxTable").DataTable({
                  dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
                  buttons: [
                    { extend: "copy", className: "btn btn-sm" },
                    { extend: "csv", className: "btn btn-sm" },
                    { extend: "excel", className: "btn btn-sm" },
                    { extend: "pdf", className: "btn btn-sm" },
                    { extend: "print", className: "btn btn-sm" },
                  ],
                    order: []  
                });
              }, 100);
            } else {
              // Handle error
              return response.json().then(data => {
                throw new Error(data.message || 'Failed to delete tax record');
              });
            }
          })
          .catch(error => {
            console.error('Error deleting tax:', error);
           localStorage.setItem('globalAlertMessage', error.message);
localStorage.setItem('globalAlertType', 'danger');
          });
        });
      });
    </script>
  </body>
</html>

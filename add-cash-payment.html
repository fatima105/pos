<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Cash Payment</title>
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="scripts/style.css" />

  <!-- Select2 -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<style>

</style>
</head>

<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-gray">
        <div class="d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Add Cash Payment</h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Home</a></li>
              <li class="breadcrumb-item"><a href="cash-payment-voucher.html"
                  class="text-primary text-decoration-none">Cash Payment</a></li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Add</li>
            </ol>
          </nav>
        </div>

        <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4"
          style="z-index: 1055; width: 400px; max-width: 90%;"></div>

        <div style="margin-top:10px;" class="d-flex justify-content-center">
          <div class="card shadow-lg bg-white">
            <div class="card-body">
              <form id="cashPaymentForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                    <input required id="date" type="date" class="form-control" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Paid From <span class="text-danger">*</span></label>
                    <input required type="text" value="Cash In Hand" readonly id="paid_from" class="form-control" />
                  </div>
                </div>

                <hr style="border-top: dotted 1px;" />
                <h5>Cash Payment Details</h5>

                <table class="table" id="cashPaymentTable">
                  <thead>
                    <tr>
                      <th>Supplier</th>
                      <th>Payable</th>
                      <th>Remarks</th>
                      <th>Amount</th>
                      <th><i id="addRowBtn" class="fa-solid fa-plus" style="cursor:pointer;"></i></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>
                        <select class="supplier form-control">
                          <option value="">--Select Supplier--</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control payable" readonly /></td>
                      <td><input type="text" class="form-control remarks" /></td>
                      <td><input type="number" class="form-control amount" /></td>
                      <td></td>
                    </tr>
                  </tbody>
                </table>

                <div class="mb-3 d-flex justify-content-end">
                  <label class="form-label fw-bold me-3 mb-0" style="width: 120px;">Total</label>
                  <input required type="text" id="total" name="total" class="form-control w-auto" value="0" readonly />
                </div>

                <div class="mb-3 d-flex justify-content-end">
                  <label class="form-label fw-bold me-3 mb-0" style="width: 120px;">Amount Paid</label>
                  <input required type="number" id="amount_paid" name="amount_paid" class="form-control w-auto" />
                </div>

                <div class="text-end">
                  <button type="submit" class="btn btn-primary">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Error Modal -->
  <div class="modal fade" id="ErrorModal" tabindex="-1" aria-labelledby="ErrorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger" id="ErrorModalLabel">
            <i class="fa-solid fa-triangle-exclamation text-danger"></i>
            Please check your errors
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Okay</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Includes -->
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/scripts.js"></script>
  <script src="config.js"></script>

  <script>
    // Select2 initializer
    function initSupplierSelect2() {
      $('.supplier').select2({
        placeholder: 'Choose Supplier',
        theme:"classic",
        allowClear: true,
        width: '100%'
      });
    }

    function loadSuppliers() {
      fetch(`${BASEURL}Supplier`)
        .then(res => res.json())
        .then(data => {
          let options = '<option value="">--Select Supplier--</option>';
          if (data.Supplier?.length > 0) {
            options += data.Supplier.map(s =>
              `<option value="${s.id}">${s.name} (${s.code})</option>`
            ).join('');
          } else {
            options = '<option value="">No Supplier found</option>';
          }

          $('.supplier').each(function () {
            const selected = $(this).val();
            $(this).html(options);
            if (selected) $(this).val(selected).trigger('change');
          });

          initSupplierSelect2(); // Apply select2 after setting options
        })
        .catch(err => console.error("Error loading suppliers:", err));
    }

    function calculateTotal() {
      let total = 0;
      $('#cashPaymentTable tbody tr').each(function () {
        const amount = parseFloat($(this).find('.amount').val());
        if (!isNaN(amount)) total += amount;
      });
      $('#total').val(total.toFixed(2));
    }

    $(document).ready(function () {
      loadSuppliers();

      $(document).on('input', '.amount', calculateTotal);

      $(document).on('change', '.supplier', function () {
        const supplierId = $(this).val();
        const $row = $(this).closest('tr');
        if (!supplierId) {
          $row.find('.payable').val('');
          return;
        }

        fetch(`${BASEURL}CashPayment/Pay/${supplierId}`)
          .then(res => res.json())
          .then(data => {
            $row.find('.payable').val(data?.pay_able ?? '0');
          })
          .catch(() => {
            $row.find('.payable').val('0');
          });
      });

      $('#addRowBtn').on('click', function () {
        const newRow = `
          <tr>
            <td><select class="supplier form-control"><option value="">--Select Supplier--</option></select></td>
            <td><input type="text" class="form-control payable" readonly /></td>
            <td><input type="text" class="form-control remarks" /></td>
            <td><input type="number" class="form-control amount" /></td>
            <td><i class="fa-solid fa-minus removeRowBtn" style="cursor:pointer; color:red;"></i></td>
          </tr>`;
        $('#cashPaymentTable tbody').append(newRow);
        loadSuppliers(); // loads data + re-applies select2
      });

      $(document).on('click', '.removeRowBtn', function () {
        $(this).closest('tr').remove();
        calculateTotal();
      });
        $('#cashPaymentForm').on('submit', function (e) {
        e.preventDefault();

        const date = $('#date').val();
        const paid_from = $('#paid_from').val();
        const total_amount = $('#amount_paid').val();
        const total = $('#total').val();

        if (parseFloat(total_amount) !== parseFloat(total)) {
          showInlineAlert('Amount Paid should be equal to Total.', 'danger');
          return;
        }

        const items = [];
        $('#cashPaymentTable tbody tr').each(function () {
          const remarks = $(this).find('.remarks').val().trim();
          const amount = parseFloat($(this).find('.amount').val());
          const supplier_id = $(this).find('.supplier').val();
          if (remarks && !isNaN(amount) && supplier_id) {
            items.push({ remarks, amount, supplier_id });
          }
        });

        if (items.length === 0) {
          showInlineAlert('Please add at least one Cash Payment detail.', 'warning');
          return;
        }

        const payload = {
          location_id: '1',
          user_id: '1',
          date,
          paid_from,
          total_amount,
          total,
          items,
        };

        const submitBtn = $(this).find('button[type="submit"]');
        submitBtn.prop('disabled', true).text('Saving...');

        fetch(`${BASEURL}CashPayment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
          .then(res => res.json())
          .then(data => {
            if (data.message?.includes('success')) {
                  sessionStorage.setItem('globalAlertMessage', 'Cash Payment saved successfully!');
  sessionStorage.setItem('globalAlertType', 'success');
         
              $('#cashPaymentForm')[0].reset();
              $('#cashPaymentTable tbody').html(`
                <tr>
                  <td><select class="  supplier"><option value="">--Select Supplier--</option></select></td>
                  <td><input type="text" class="form-control payable" readonly /></td>
                  <td><input type="text" class="form-control remarks" /></td>
                  <td><input type="number" class="form-control amount" /></td>
                  <td></td>
                </tr>`);
              $('#total').val('0');
              loadSuppliers();
                 window.location.href = "cash-payment-voucher.html";
            } else {
              showInlineAlert('Failed to save Cash Payment.', 'danger');
            }
          })
          .catch(err => {
            showInlineAlert('Error saving Cash Payment!', 'danger');
            console.error(err);
          })
          .finally(() => {
            submitBtn.prop('disabled', false).text('Save');
          });
      });
    
    });

  </script>
</body>
</html>

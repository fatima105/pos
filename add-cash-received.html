<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Cash Received</title>

  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="scripts/style.css" />

  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="main-container">
    <div id="sidebar-container"></div>
    <div class="content-container">
      <div class="container-fluid bg-gray">
        <div class="d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Add Cash Received</h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Home</a></li>
              <li class="breadcrumb-item"><a href="cash-received-voucher.html" class="text-primary text-decoration-none">Cash Received</a></li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Add</li>
            </ol>
          </nav>
        </div>

        <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index:1055;width:400px;max-width:90%;"></div>

        <div style="margin-top:10px;" class="d-flex justify-content-center">
          <div class="card shadow-lg bg-white">
            <div class="card-body">
              <form id="cashReceivedForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                    <input required id="date" type="date" class="form-control" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Paid From <span class="text-danger">*</span></label>
                    <input required type="text" value="Cash In Hand" readonly id="received_in" class="form-control" />
                  </div>
                </div>

                <hr style="border-top: dotted 1px;" />
                <h5>Cash Received Details</h5>

                <table class="table" id="cashReceivedTable">
                  <thead>
                    <tr>
                      <th>Customer</th>
                      <th>Receivable</th>
                      <th>Remarks</th>
                      <th>Amount</th>
                      <th><i id="addRowBtn" class="fa-solid fa-plus" style="cursor:pointer;"></i></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>
                        <select class="customer form-control" style="width:100%;">
                          <option value="">--Select Customer--</option>
                        </select>
                      </td>
                      <td><input type="text" class="form-control received_in" readonly /></td>
                      <td><input type="text" class="form-control remarks" /></td>
                      <td><input type="number" class="form-control amount" /></td>
                      <td></td>
                    </tr>
                  </tbody>
                </table>

                <div class="mb-3 d-flex justify-content-end">
                  <label class="form-label fw-bold me-3 mb-0" style="width:120px;">Total</label>
                  <input required type="text" id="total" name="total" class="form-control w-auto" value="0" readonly />
                </div>

                <div class="mb-3 d-flex justify-content-end">
                  <label class="form-label fw-bold me-3 mb-0" style="width:120px;">Amount Paid</label>
                  <input required type="number" id="amount_paid" name="amount_paid" class="form-control w-auto" />
                </div>

                <div class="text-end">
                  <button type="submit" class="btn btn-primary">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Error Modal -->
  <div class="modal fade" id="ErrorModal" tabindex="-1" aria-labelledby="ErrorModalLabel" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger"><i class="fa-solid fa-triangle-exclamation text-danger"></i> Please check your errors</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Okay</button></div>
    </div></div>
  </div>

  <!-- JS Includes -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/scripts.js"></script>
  <script src="config.js"></script>

  <script>
    // ✅ Date max = today
    document.getElementById('date').max = new Date().toISOString().split("T")[0];

    // ✅ Initialize Select2 on all .customer selects
    function initCustomerSelect2() {
      $('.customer').select2({
        placeholder: 'Choose Customer',
        allowClear: true,
        width: 'resolve'
      });
    }

    // ✅ Load all customers once, set into dropdowns, and re-init Select2
    function loadCustomers() {
      fetch(`${BASEURL}Customer`)
        .then(res => res.json())
        .then(data => {
          let options = '<option value="">--Select Customer--</option>';
          if (data.Customer?.length > 0) {
            options += data.Customer.map(c =>
              `<option value="${c.id}">${c.name} (${c.company})</option>`
            ).join('');
          } else {
            options = '<option value="">No Customer Found</option>';
          }

          $('.customer').each(function () {
            const selected = $(this).val();
            $(this).html(options);
            if (selected) $(this).val(selected).trigger('change');
          });

          initCustomerSelect2(); // re-initialize
        })
        .catch(err => console.error("Error loading customers:", err));
    }

    // ✅ Show alert on top
    function showInlineAlert(message, type = 'info') {
      const alertPlaceholder = document.getElementById('alertPlaceholder');
      const alertHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
      alertPlaceholder.innerHTML = alertHTML;
      setTimeout(() => {
        const alert = alertPlaceholder.querySelector('.alert');
        if (alert) alert.classList.remove('show');
      }, 5000);
    }

    // ✅ Calculate total
    function calculateTotal() {
      let total = 0;
      $('#cashReceivedTable tbody tr').each(function () {
        const amount = parseFloat($(this).find('.amount').val());
        if (!isNaN(amount)) total += amount;
      });
      $('#total').val(total.toFixed(2));
    }

    $(document).ready(function () {
      loadCustomers();

      $(document).on('input', '.amount', calculateTotal);

      // ✅ Auto-fill receivable when selecting customer
      $(document).on('change', '.customer', function () {
        const customerId = $(this).val();
        const $row = $(this).closest('tr');
        if (!customerId) {
          $row.find('.received_in').val('');
          return;
        }
        fetch(`${BASEURL}CashReceived/Rec/${customerId}`)
          .then(res => res.json())
          .then(data => {
            $row.find('.received_in').val(data?.receivable ?? '0');
          })
          .catch(() => {
            $row.find('.received_in').val('0');
          });
      });

      // ✅ Add new row
      $('#addRowBtn').on('click', function () {
        const newRow = `
          <tr>
            <td>
              <select class="customer form-control" style="width:100%;">
                <option value="">--Select Customer--</option>
              </select>
            </td>
            <td><input type="text" class="form-control received_in" readonly /></td>
            <td><input type="text" class="form-control remarks" /></td>
            <td><input type="number" class="form-control amount" /></td>
            <td><i class="fa-solid fa-minus removeRowBtn" style="cursor:pointer; color:red;"></i></td>
          </tr>`;
        $('#cashReceivedTable tbody').append(newRow);
        loadCustomers(); // reload for new row
      });

      // ✅ Remove row
      $(document).on('click', '.removeRowBtn', function () {
        $(this).closest('tr').remove();
        calculateTotal();
      });

      // ✅ Form submit
      $('#cashReceivedForm').on('submit', function (e) {
        e.preventDefault();

        const date = $('#date').val();
        const received_in = $('#received_in').val();
        const total_amount = $('#amount_paid').val();
        const total = $('#total').val();

        if (parseFloat(total_amount) !== parseFloat(total)) {
          showInlineAlert('Amount Paid should be equal to Total.', 'danger');
          return;
        }

        const items = [];
        $('#cashReceivedTable tbody tr').each(function () {
          const remarks = $(this).find('.remarks').val().trim();
          const amount = parseFloat($(this).find('.amount').val());
          const customer_id = $(this).find('.customer').val();
          if (remarks && !isNaN(amount) && customer_id) {
            items.push({ remarks, amount, customer_id });
          }
        });

        if (items.length === 0) {
          showInlineAlert('Please add at least one Cash Received detail.', 'warning');
          return;
        }

        const payload = {
          location_id: '1',
          user_id: '1',
          date,
          received_in,
          total_amount,
          total,
          items,
        };

        const submitBtn = $(this).find('button[type="submit"]');
        submitBtn.prop('disabled', true).text('Saving...');

        fetch(`${BASEURL}CashReceived`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        .then(res => res.json())
        .then(data => {
          if (data.message?.includes('success')) {
            sessionStorage.setItem('globalAlertMessage', 'Cash Received saved successfully!');
            sessionStorage.setItem('globalAlertType', 'success');
            window.location.href = "cash-received-voucher.html";
          } else {
            showInlineAlert('Failed to save Cash Received.', 'danger');
          }
        })
        .catch(err => {
          showInlineAlert('Error saving Cash Received!', 'danger');
          console.error(err);
        })
        .finally(() => {
          submitBtn.prop('disabled', false).text('Save');
        });
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Expense</title>

  <!-- Styles -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <link href="scripts/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="scripts/style.css" />

  <style>
    .bg-buttons {
      background-color: #6c757d;
      color: #e9ecef;
    }
    .bg-buttons .btn {
      background-color: #6c757d;
      color: #e9ecef;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    .removeRowBtn {
      cursor: pointer;
      color: red;
    }
  </style>
</head>
<body>
  <!-- Alert Placeholder -->
  <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4"
       style="z-index: 1055; width: 400px; max-width: 90%;"></div>

  <div class="main-container">
    <div id="sidebar-container"></div>

    <div class="content-container">
      <div class="container-fluid bg-white py-3">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="mb-0">Add Expense</h2>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Home</a></li>
              <li class="breadcrumb-item"><a href="expense-voucher.html" class="text-primary text-decoration-none">Expense</a></li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Add</li>
            </ol>
          </nav>
        </div>

        <div class="card shadow-lg mt-5">
          <div class="container mt-4 mb-4">
            <form id="ExpenseAdd">
              <div class="row">
          
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Date<span class="text-danger">*</span></label>
                  <input required id="date" type="date" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Paid From<span class="text-danger">*</span></label>
                  <input required type="text" value="Cash In Hand" readonly id="paid_from" class="form-control" />
                </div>
              </div>

              <hr style="border-top: dotted 1px;" />
              <h5>Expense Details</h5>

              <table class="table" id="expenseTable">
                <thead>
                  <tr>
                    <th>Remarks</th>
                    <th>Amount</th>
                    <th><i id="addRowBtn" class="fa-solid fa-plus" style="cursor:pointer;"></i></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><input type="text" class="form-control remarks" /></td>
                    <td><input type="number" class="form-control amount" /></td>
                    <td></td>
                  </tr>
                </tbody>
              </table>

              <div class="mb-3 d-flex justify-content-end">
                <label class="form-label fw-bold me-3 mb-0" style="width: 120px;">Total</label>
                <input required type="text" id="total" name="total" class="form-control w-auto" value="0" readonly />
              </div>

              <div class="mb-3 d-flex justify-content-end">
                <label class="form-label fw-bold me-3 mb-0" style="width: 120px;">Amount Paid</label>
                <input required type="number" id="amount_paid" name="amount_paid" class="form-control w-auto" />
              </div>

              <div class="text-end">
                <button type="submit" class="btn btn-primary">Save</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/select2.min.js"></script>
  <script src="config.js"></script>

  <script>
      fetch("scripts/footer.html")
    .then((res) => res.text())
    .then((data) => {
      $("#footer-container").html(data);
      $("#year").text(new Date().getFullYear());
    });

  fetch("sidebar.html")
    .then((res) => res.text())
    .then((data) => {
      $("#sidebar-container").html(data);
    });
    const datePickerId=document.getElementById('date');
datePickerId.max = new Date().toISOString().split("T")[0];
    function showInlineAlert(message, type = 'info') {
      const alertPlaceholder = document.getElementById('alertPlaceholder');
      const alertHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
      alertPlaceholder.innerHTML = alertHTML;

      setTimeout(() => {
        const alert = alertPlaceholder.querySelector('.alert');
        if (alert) alert.classList.remove('show');
      }, 5000);
    }

    function calculateTotal() {
      let total = 0;
      $('#expenseTable tbody tr').each(function () {
        const amount = parseFloat($(this).find('.amount').val());
        if (!isNaN(amount)) {
          total += amount;
        }
      });
      $('#total').val(total.toFixed(2));
    }

    $(document).ready(function () {
      $(document).on('input', '.amount', calculateTotal);

      $('#addRowBtn').on('click', function () {
        $('#expenseTable tbody').append(`
          <tr>
            <td><input type="text" class="form-control remarks" /></td>
            <td><input type="number" class="form-control amount" /></td>
            <td><i class="fa-solid fa-minus removeRowBtn" style="cursor:pointer; color:red;"></i></td>
          </tr>
        `);
      });

      $(document).on('click', '.removeRowBtn', function () {
        $(this).closest('tr').remove();
        calculateTotal();
      });

      $('#ExpenseAdd').on('submit', function (e) {
        e.preventDefault();

      
        const date = $('#date').val();
        const paid_from = $('#paid_from').val();
        const amount_paid = $('#amount_paid').val();
        const total = $('#total').val();

        if (parseFloat(amount_paid) !== parseFloat(total)) {
          showInlineAlert('Amount Paid should be equal to Total.', 'danger');
          return;
        }

        const items = [];
        $('#expenseTable tbody tr').each(function () {
          const remarks = $(this).find('.remarks').val().trim();
          const amount = parseFloat($(this).find('.amount').val());

          if (remarks && !isNaN(amount)) {
            items.push({ remarks, amount });
          }
        });

        if (items.length === 0) {
          showInlineAlert('Please add at least one expense detail.', 'warning');
          return;
        }

        const payload = {
          location_id: '1',
          user_id: '1',
       
          date,
          paid_from,
          amount_paid,
          total,
          items,
        };

        console.log("Submitting:", payload);

        const submitBtn = $(this).find('button[type="submit"]');
        submitBtn.prop('disabled', true).text('Saving...');

        fetch(`${BASEURL}expenses`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
          .then(res => res.json())
          .then(data => {
            if (data.message?.includes('success')) {
    sessionStorage.setItem('globalAlertMessage', 'Expense saved successfully!');
  sessionStorage.setItem('globalAlertType', 'success');
              $('#ExpenseAdd')[0].reset();
              $('#expenseTable tbody').empty().append(`
                <tr>
                  <td><input type="text" class="form-control remarks" /></td>
                  <td><input type="number" class="form-control amount" /></td>
                  <td></td>
                </tr>
              `);
              $('#total').val('0');
           
    window.location.href = "expense-voucher.html";

            } else {
              showInlineAlert('Failed to save expense.', 'danger');
              console.warn('Response:', data);
            }
          })
          .catch(err => {
            showInlineAlert('Error saving expense!', 'danger');
            console.error(err);
          })
          .finally(() => {
            submitBtn.prop('disabled', false).text('Save');
          });
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Tax</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />
</head>

<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-gray ">
        <div class="d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Add tax</h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="index.html" class="text-primary text-decoration-none">Home</a>
              </li>
              <li class="breadcrumb-item">
                <a href="Tax.html" class="text-primary text-decoration-none">Taxes</a>
              </li>
              <li class="breadcrumb-item active text-muted" aria-current="page">
                Add
              </li>
            </ol>
          </nav>
        </div>
   <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

        <!-- Unit Add Section -->
        <div style="margin-top:10px;" class="d-flex justify-content-center  ">
          <div class="card px-2 shadow-lg bg-white" style="width: 80%; max-width: 500px">

            <form action="" id="taxAdd">
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Tax Name <span class="text-danger fw-bold">*</span></label>
                  <input id="name" value="" type="text" class="form-control" required />
                </div>

                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Tax Rate (%)<span class="text-danger fw-bold">*</span></label>
                  <input id="tax_rate" step="any" value="" type="number" class="form-control" required />
                </div>




                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Status <span class="text-danger  fw-bold">*</span></label>
                  <select id="status" class="form-select">
                    <option>Active</option>
                    <option>Block</option>
                  </select>

                </div>
              </div>
              <button type="submit" class="btn btn-primary mb-2">Submit</button>
            </form>
          </div>
        </div>
      </div>
      <!-- Footer -->
      <div id="footer-container"></div>
    </div>
  </div>
  <!-- Error Modal -->
  <div class="modal fade" id="ErrorModal" tabindex="-1" aria-labelledby="ErrorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger" id="ErrorModalLabel">
            <i class="fa-solid fa-triangle-exclamation text-danger"></i>
            Please check your errors
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Okay</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap JS -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
  <script src="scripts/bootstrap.bundle.min.js"></script>

  <script src="scripts/scripts.js"></script>
  <script src="config.js"></script>


<script>
  document.addEventListener("DOMContentLoaded", async function () {
    // ✅ Load Footer
    try {
      const footerResponse = await fetch("scripts/footer.html");
      const footerHTML = await footerResponse.text();
      document.getElementById("footer-container").innerHTML = footerHTML;
      document.getElementById("year").textContent = new Date().getFullYear();
    } catch (error) {
      console.error("Error loading footer:", error);
    }

    // ✅ Load Sidebar
    try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
      const sidebarContainer = document.getElementById("sidebar-container");
      sidebarContainer.innerHTML = sidebarHTML;

      // ✅ Load sidebar script after sidebar HTML is added
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js"; // Make sure initSidebar() is defined here
      sidebarScript.onload = function () {
        if (typeof initSidebar === "function") {
          initSidebar(); // Initialize sidebar (user info, active links, etc.)
        }
      };
      document.body.appendChild(sidebarScript);
    } catch (error) {
      console.error("Error loading sidebar:", error);
    }

    // ✅ Form submission logic
    const taxAdd = document.getElementById("taxAdd");
    if (taxAdd) {
      taxAdd.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const tax_rate = document.getElementById("tax_rate").value.trim();
        const status = document.getElementById("status").value;

        if (name === "" || status === "") {
          const errorModal = new bootstrap.Modal(document.getElementById('ErrorModal'));
          errorModal.show();
          return;
        }

        const apiUrl = `${BASEURL}Tax`;

        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, tax_rate, status })
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.id) {
              localStorage.setItem('globalAlertMessage', "✅ Tax added successfully");
              localStorage.setItem('globalAlertType', 'success');
              taxAdd.reset();
              window.location.href = "Tax.html"; // redirect
            } else {
              localStorage.setItem('globalAlertMessage', "⚠️ Error adding tax.");
              localStorage.setItem('globalAlertType', 'warning');
            }
          })
          .catch((err) => {
            console.error("Error:", err);
            localStorage.setItem('globalAlertMessage', "❌ Failed to add data.");
            localStorage.setItem('globalAlertType', 'danger');
          });
      });
    }
  });
</script>


</body>

</html>

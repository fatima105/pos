<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Users</title>

    <!-- Bootstrap CSS -->
    <link href="scripts/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
</head>

<body>
    <div class="main-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Content Area -->
        <div class="content-container">
            <div class="container-fluid bg-light py-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">Edit Profile</h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item">
                                <a href="index.html" class="text-primary text-decoration-none">Home</a>
                            </li>
                            <li class="breadcrumb-item active text-muted" aria-current="page">
                                My Profile
                            </li>
                        </ol>
                    </nav>
                </div>

                <!-- Profile Edit Section -->
                <div class="d-flex justify-content-center align-items-center vh-100">
                    <div class="card p-4 shadow-lg" style="width: 50%; max-width: 500px">
                        <h3 class="text-center">Add Users</h3>

                        <!-- Alert placeholder -->
                        <div id="alertPlaceholder"></div>

                        <!-- User Form -->
                        <form id="userForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <select name="role" class="form-control" required>
                                    <option value="admin">Admin</option>
                                    <option value="user">User</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-control" required>
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Submit
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Footer -->
            <div id="footer-container"></div>
        </div>
    </div>




    <!-- Bootstrap JS -->
    <script src="scripts/bootstrap.bundle.min.js"></script>

    <script src="scripts/scripts.js"></script>
    <script src="config.js"></script>
<script>
  // ✅ Utility: Inline Alert
  function showInlineAlert(message, type = "info") {
    const alertPlaceholder = document.getElementById("alertPlaceholder");
    if (!alertPlaceholder) return; // Skip if no alert container found

    const alertHTML = `
      <div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    `;

    alertPlaceholder.innerHTML = alertHTML;

    // Auto-hide after 5 seconds
    setTimeout(() => {
      const alert = alertPlaceholder.querySelector(".alert");
      if (alert) alert.classList.remove("show");
    }, 5000);
  }

  // ✅ Load Footer
  async function loadFooter() {
    const footerContainer = document.getElementById("footer-container");
    if (!footerContainer) return;

    try {
      const res = await fetch("footer.html");
      if (!res.ok) throw new Error("Footer file not found");
      const html = await res.text();
      footerContainer.innerHTML = html;

      const yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    } catch (err) {
      console.error("Error loading footer:", err);
    }
  }

  // ✅ Load Sidebar
  async function loadSidebar() {
    const sidebarContainer = document.getElementById("sidebar-container");
    if (!sidebarContainer) return;

    try {
      const res = await fetch("sidebar.html");
      if (!res.ok) throw new Error("Sidebar file not found");
      const html = await res.text();
      sidebarContainer.innerHTML = html;

      // Load sidebar script dynamically
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js";
      sidebarScript.onload = () => {
        if (typeof initSidebar === "function") initSidebar();
      };
      document.body.appendChild(sidebarScript);
    } catch (err) {
      console.error("Error loading sidebar:", err);
    }
  }

  // ✅ Form Submission Handler
  async function handleUserFormSubmit() {
    const form = document.getElementById("userForm");
    if (!form) return;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const userData = {
        location_id: 1,
        name: form.name.value,
        email: form.email.value,
        role: form.role.value,
        password: form.password.value,
        status: form.status.value,
      };

      console.log("Submitting user data:", userData);

      try {
        const res = await fetch(`${BASEURL}users/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(userData),
        });

        console.log("Request sent, awaiting response...");
        const data = await res.json();

        if (res.ok) {
          showInlineAlert("User created successfully!", "success");
          console.log("Response:", data);
        } else {
          showInlineAlert("Error: " + (data.error || "Unknown error"), "danger");
        }
      } catch (err) {
        console.error("Error:", err);
        showInlineAlert("Something went wrong", "danger");
      }
    });
  }

  // ✅ Initialize Everything Once DOM is Loaded
  document.addEventListener("DOMContentLoaded", () => {
    loadFooter();
    loadSidebar();
    handleUserFormSubmit();

    // Optional: Initialize charts if present
    const visitorsChart = document.getElementById("visitorsChart");
    if (visitorsChart) {
      // init visitors chart here
    }

    const salesChart = document.getElementById("salesChart");
    if (salesChart) {
      // init sales chart here
    }
  });
</script>

</body>

</html>

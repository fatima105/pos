<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assign Modules to User</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />
</head>

<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-light py-3">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="mb-0">Assign Modules</h2>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="index.html" class="text-primary text-decoration-none">Home</a>
              </li>
              <li class="breadcrumb-item active text-muted" aria-current="page">
                Assign Modules
              </li>
            </ol>
          </nav>
        </div>

        <!-- Assign Section -->
        <div class="d-flex justify-content-center align-items-center vh-100">
          <div class="card p-4 shadow-lg" style="width: 60%; max-width: 600px">
            <h3 class="text-center">Assign Modules to User</h3>

            <!-- Alert placeholder -->
            <div id="alertPlaceholder"></div>

            <!-- Assign Form -->
            <form id="assignModuleForm">
              <!-- Select User -->
              <div class="mb-3">
                <label class="form-label">Select User</label>
                <select id="user_id" class="form-select" required></select>
              </div>

              <!-- Select Modules -->
              <div class="mb-3">
                <label class="form-label">Select Modules</label>
                <select id="module_id" class="form-select" multiple required></select>
              </div>

              <button type="submit" class="btn btn-primary w-100">Assign Modules</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/scripts.js"></script>
  <script src="config.js"></script>
  <!-- jQuery (required for Select2) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <script>
    // Utility: Inline Alert
    function showInlineAlert(message, type = "info") {
      const alertPlaceholder = document.getElementById("alertPlaceholder");
      if (!alertPlaceholder) return;

      const alertHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
      alertPlaceholder.innerHTML = alertHTML;

      setTimeout(() => {
        const alert = alertPlaceholder.querySelector(".alert");
        if (alert) alert.classList.remove("show");
      }, 4000);
    }

    // Load Footer
    function loadFooter() {
      const footerContainer = document.getElementById("footer-container");
      if (!footerContainer) return;
      fetch("footer.html")
        .then((res) => res.text())
        .then((html) => {
          footerContainer.innerHTML = html;
          const yearEl = document.getElementById("year");
          if (yearEl) yearEl.textContent = new Date().getFullYear();
        })
        .catch((err) => console.error("Error loading footer:", err));
    }

    // Load Sidebar
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const sidebarResponse = await fetch("sidebar.html");
    const sidebarHTML = await sidebarResponse.text();
    document.getElementById("sidebar-container").innerHTML = sidebarHTML;

    // Load sidebar script dynamically
    const sidebarScript = document.createElement("script");
    sidebarScript.src = "scripts/scripts.js";
    sidebarScript.onload = () => {
      if (typeof initSidebar === "function") initSidebar();
    };
    document.body.appendChild(sidebarScript);
  } catch (err) {
    console.error("Error loading sidebar:", err);
  }

});

    // Fetch Users
    async function loadUsers() {
      const res = await fetch(`${BASEURL}users/users`);
      const users = await res.json();
      const userSelect = document.getElementById("user_id");
      users.forEach(user => {
        let option = document.createElement("option");
        option.value = user.id;
        option.textContent = `${user.name} (${user.email})`;
        userSelect.appendChild(option);
      });
      $("#user_id").select2({ width: "100%", placeholder: "Select a user" });
    }

    // Fetch Modules
    async function loadModules() {
      const res = await fetch(`${BASEURL}modules`);
      const modules = await res.json();
      const moduleSelect = document.getElementById("module_id");
      modules.forEach(mod => {
        let option = document.createElement("option");
        option.value = mod.id;
        option.textContent = mod.name;
        moduleSelect.appendChild(option);
      });
      $("#module_id").select2({ width: "100%", placeholder: "Select modules" });
    }

    // Submit Assign Form
    document.addEventListener("DOMContentLoaded", () => {
      loadUsers();
      loadModules();
      loadFooter();
      loadSidebar();

      const form = document.getElementById("assignModuleForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const selectedModules = $("#module_id").val(); // Select2 handles multiple nicely
console.log("SelectedModules",selectedModules);
        const data = {
          user_id: document.getElementById("user_id").value,
          module_ids: selectedModules
        };

        try {
          const res = await fetch(`${BASEURL}assign`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const result = await res.json();
          if (res.ok) {
            showInlineAlert("✅ Modules assigned successfully!", "success");
            $("#module_id").val(null).trigger("change"); // reset select2
            form.reset();
          } else {
            showInlineAlert("❌ Error: " + result.error, "danger");
          }
        } catch (err) {
          console.error("Error:", err);
          showInlineAlert("⚠️ Something went wrong", "danger");
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash Received</title>

    <!-- Bootstrap CSS -->
    <link href="scripts/bootstrap.min.css" rel="stylesheet" />

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />

    <style>
      .bg-buttons {
        background-color: #6c757d;
        color: #e9ecef;
        outline: none !important;
        border: none !important;
        box-shadow: none !important;
      }

      .bg-buttons .btn {
        background-color: #6c757d;
        color: #e9ecef;
        outline: none !important;
        border: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>

  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-white py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Cash Received</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item active text-muted" aria-current="page">
                  Cash Received
                </li>
              </ol>
            </nav>
          </div>

          <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <div class="card shadow-lg mt-5">
            <div class="container mt-4 mb-4">
              <div class="d-flex justify-content-end mb-3">
                <a href="add-cash-received.html" class="btn btn-primary btn-sm d-flex align-items-center px-2 py-2">
                  <i class="fa-solid fa-plus me-1"></i> Add Cash Received
                </a>
              </div>
              <hr class="mt-2" />

              <table id="CashReceived" class="table table-striped table-bordered mt-4">
                <thead class="table-light text-dark">
                  <tr>
                    <th>Code</th>
                    <th>Date</th>
                    <th>Remarks</th>
                    <th>Amount</th>
                    <th>Received In</th>
                    <th>Added By</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>

    <!-- JS Libraries -->
    <script src="scripts/jquery-3.6.0.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="scripts/jquery.dataTables.min.js"></script>
    <script src="scripts/dataTables.buttons.min.js"></script>
    <script src="scripts/jszip.min.js"></script>
    <script src="scripts/pdfmake.min.js"></script>
    <script src="scripts/vfs_fonts.js"></script>
    <script src="scripts/buttons.html5.min.js"></script>
    <script src="scripts/buttons.print.min.js"></script>
    <script src="config.js"></script>

    <script>
      function showInlineAlert(message, type = 'info') {
        const alertPlaceholder = document.getElementById('alertPlaceholder');
        const alertHTML = `
          <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
        alertPlaceholder.innerHTML = alertHTML;

        setTimeout(() => {
          const alert = alertPlaceholder.querySelector('.alert');
          if (alert) alert.classList.remove('show');
        }, 5000);
      }

      async function loadCashReceivedData() {
        const url = `${BASEURL}CashReceived`;

        try {
          const response = await fetch(url, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.json();
          console.log("API Response:", result);

          window.CashReceived.clear();

          const CashReceivedArray = Array.isArray(result.data) ? result.data : [];

          CashReceivedArray.forEach(cp => {
            window.CashReceived.row.add([
              cp.voucher_no || "",
              cp.date ? new Date(cp.date).toLocaleDateString() : "",
              cp.remarks || "Cash Received Made",
              cp.amount,
              cp.received_in || "",
              cp.user_id || "",
              `
                <div class="d-flex gap-2">
                  <a href="specific-voucher-cash-received.html?id=${cp.id}" class="btn btn-sm">
                    <i class="fas fa-eye" style="color:blue;"></i>
                  </a>
                </div>
              `
            ]);
          });

          window.CashReceived.draw();

        } catch (error) {
          console.error("Error fetching CashReceived:", error);
          showInlineAlert("Failed to load Cash Received data.", "danger");
        }
      }

      document.addEventListener("DOMContentLoaded", async function () {
        // Load Footer
        fetch("scripts/footer.html")
          .then(res => res.text())
          .then(html => {
            document.getElementById("footer-container").innerHTML = html;
            const yearEl = document.getElementById("year");
            if (yearEl) yearEl.textContent = new Date().getFullYear();
          });

        // Load Sidebar
        fetch("sidebar.html")
          .then(res => res.text())
          .then(html => {
            document.getElementById("sidebar-container").innerHTML = html;
          });

        // Initialize DataTable
        window.CashReceived = $("#CashReceived").DataTable({
          dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
          buttons: [
            { extend: "copy", className: "btn btn-sm" },
            { extend: "csv", className: "btn btn-sm" },
            { extend: "excel", className: "btn btn-sm" },
            { extend: "pdf", className: "btn btn-sm" },
            { extend: "print", className: "btn btn-sm" },
          ],
            order: []  
        });

        // Load Data
        await loadCashReceivedData();
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Category</title>
   <link href="scripts/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap CSS -->

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-gray ">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Edit Category</h4>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item">
                  <a href="Categories.html" class="text-primary text-decoration-none"
                    >Category</a
                  >
                </li>
                <li
                  class="breadcrumb-item active text-muted"
                  aria-current="page"
                >
                  Edit
                </li>
              </ol>
            </nav>
          </div>
    <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <!-- Category Edit Section -->
          <div style="margin-top:10px;"class="d-flex justify-content-center  ">
            <div
              class="card  py-3 px-3 shadow-lg bg-white"
              style="width: 80%; max-width: 500px"
            >
       
              <form action="" id="CategoryUpdate">
                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold"
                      >Category Name <span class="text-danger fw-bold">*</span></label
                    >
                    <input id="categoryId" type="hidden"class="form-control" required />
                 
                    <input id="name" type="text" class="form-control" required />
                  </div>
             
                  <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold"
                      >Category Description <span class="text-danger fw-bold">*</span></label
                    >
                 
                    <textarea id="description" rows="4" class="form-control" required></textarea>

                  </div>
                  <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold"
                      >Status <span class="text-danger  fw-bold">*</span></label
                    >
                    <select id="status" class="form-select">
                      <option>Active</option>
                      <option>Block</option>
                    </select>
                
                  </div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
          </div>
        </div>
        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>
 <!-- Error Modal -->
<div class="modal fade" id="ErrorModal" tabindex="-1" aria-labelledby="ErrorModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger" id="ErrorModalLabel">
          <i class="fa-solid fa-triangle-exclamation text-danger"></i>
          Please check your errors
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Okay</button>
      </div>
    </div>
  </div>
</div>

      <script src="config.js"></script>
    <!-- Bootstrap JS -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
 <script src="scripts/bootstrap.bundle.min.js"></script>
   
    <script src="scripts/scripts.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", async function () {
    // ✅ Load Footer
    try {
      const footerResponse = await fetch("scripts/footer.html");
      const footerHTML = await footerResponse.text();
      document.getElementById("footer-container").innerHTML = footerHTML;
      document.getElementById("year").textContent = new Date().getFullYear();
    } catch (error) {
      console.error("Error loading footer:", error);
    }

    // ✅ Load Sidebar
    try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
      const sidebarContainer = document.getElementById("sidebar-container");
      sidebarContainer.innerHTML = sidebarHTML;

      // Load sidebar script AFTER sidebar is inserted
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js"; // Ensure initSidebar() exists there
      sidebarScript.onload = function () {
        if (typeof initSidebar === "function") {
          initSidebar(); // Initialize sidebar (user info, links, etc.)
        }
      };
      document.body.appendChild(sidebarScript);
    } catch (error) {
      console.error("Error loading sidebar:", error);
    }

    // ✅ Extract category ID from query params
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const categoryId = getQueryParam("id");
    console.log("Category ID:", categoryId);
    document.getElementById("categoryId").value = categoryId || "";

    // ✅ Fetch category data if ID is present
    if (categoryId) {
      const apiUrl = `${BASEURL}Category/${categoryId}`;
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();

        if (data && typeof data === "object") {
          const { name, status, description } = data;
          document.getElementById("name").value = name || "";
          document.getElementById("status").value = status || "Active";
          document.getElementById("description").value = description || "";
        } else {
          throw new Error("Invalid data format");
        }
      } catch (err) {
        console.error("Error fetching category data:", err);
      }
    } else {
      console.log("No Category ID found in the URL.");
    }

    // ✅ Handle Category Update
    const CategoryUpdate = document.getElementById("CategoryUpdate");
    if (CategoryUpdate) {
      CategoryUpdate.addEventListener("submit", async (e) => {
        e.preventDefault();

        const categoryId = document.getElementById("categoryId").value;
        const name = document.getElementById("name").value.trim();
        const description = document.getElementById("description").value.trim();
        const status = document.getElementById("status").value;

        console.log(name, description, status, categoryId);

        if (!name || !description || !status) {
          const errorModal = new bootstrap.Modal(document.getElementById("ErrorModal"));
          errorModal.show();
          return;
        }

        const apiUrl = `${BASEURL}Category`;
        try {
          const res = await fetch(apiUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, status, id: categoryId, description }),
          });

          const data = await res.json();
          if (data.status === "success") {
            localStorage.setItem("globalAlertMessage", "✅ Category Data Updated");
            localStorage.setItem("globalAlertType", "success");
            window.location.href = "Categories.html";
          } else {
            localStorage.setItem("globalAlertMessage", "⚠️ Category Not Updated");
            localStorage.setItem("globalAlertType", "danger");
          }
        } catch (err) {
          console.error("Error:", err);
          localStorage.setItem("globalAlertMessage", "❌ Failed to Update Category");
          localStorage.setItem("globalAlertType", "danger");
        }
      });
    }
  });
</script>

      
  </body>
</html>

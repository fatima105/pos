<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit SubCategory</title>

  <!-- Bootstrap CSS -->
   <link href="scripts/bootstrap.min.css" rel="stylesheet" /><!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />
</head>
<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-gray">
        <div class="d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Edit SubCategory</h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="index.html" class="text-primary text-decoration-none">Home</a>
              </li>
              <li class="breadcrumb-item">
                <a href="SubCategories.html" class="text-primary text-decoration-none">SubCategory</a>
              </li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Edit</li>
            </ol>
          </nav>
        </div>
   <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

        <!-- SubCategory Edit Section -->
        <div class="d-flex justify-content-center" style="margin-top: 10px;">
          <div class="card py-3 px-3 shadow-lg bg-white" style="width: 80%; max-width: 500px;">
            <form action="" id="SubCategoryUpdate">
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Parent Category <span class="text-danger fw-bold">*</span></label>
                  <select id="category_id" class="form-select"></select>
                </div>

                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Sub Category Name <span class="text-danger fw-bold">*</span></label>
                  <input id="SubCategoryId" type="hidden" class="form-control" required />
                  <input id="name" type="text" class="form-control" required />
                </div>

                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">SubCategory Description <span class="text-danger fw-bold">*</span></label>
                  <textarea id="description" rows="4" class="form-control" required></textarea>
                </div>

                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Status <span class="text-danger fw-bold">*</span></label>
                  <select id="status" class="form-select">
                    <option>Active</option>
                    <option>Block</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-primary">Submit</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div id="footer-container"></div>
    </div>
  </div>



  <!-- Scripts -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
 <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/scripts.js"></script>
   <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      // Load Footer
      fetch("scripts/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-container").innerHTML = data;
          document.getElementById("year").textContent = new Date().getFullYear();
        })
        .catch((error) => console.error("Error loading footer:", error));

      // Load Sidebar
    try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
      const sidebarContainer = document.getElementById("sidebar-container");
      sidebarContainer.innerHTML = sidebarHTML;

      // Load sidebar script AFTER sidebar is inserted
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js"; // Ensure initSidebar() exists there
      sidebarScript.onload = function () {
        if (typeof initSidebar === "function") {
          initSidebar(); // Initialize sidebar (user info, links, etc.)
        }
      };
      document.body.appendChild(sidebarScript);
    } catch (error) {
      console.error("Error loading sidebar:", error);
    }
    });

    // Get query param
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const SubCategoryId = getQueryParam('id');
    document.getElementById('SubCategoryId').value = SubCategoryId;

    if (SubCategoryId) {
      const apiUrl = `${BASEURL}SubCategory/${SubCategoryId}`;
      fetch(apiUrl)
        .then((res) => {
          if (!res.ok) throw new Error("Network response was not ok");
          return res.json();
        })
        .then((data) => {
          const { name, status, description, category_id } = data;
          document.getElementById("name").value = name || "";
          document.getElementById("status").value = status || "Active";
          document.getElementById("description").value = description || "";
          document.getElementById("category_id").value = category_id;
        })
        .catch((err) => {
          console.error("Error fetching Sub category data:", err);
        });
    }

    // Submit handler
    document.getElementById("SubCategoryUpdate").addEventListener("submit", (e) => {
      e.preventDefault();
      const category_id = document.getElementById("category_id").value;
      const name = document.getElementById("name").value.trim();
      const description = document.getElementById("description").value.trim();
      const status = document.getElementById("status").value;

      if (name === "" || description === "" || status === "" || category_id === "") {
    localStorage.setItem('globalAlertMessage', 'Please fill all fields');
localStorage.setItem('globalAlertType', 'danger');
window.location.href = 'SubCategories.html';

      }

      fetch(`${BASEURL}SubCategory`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: SubCategoryId, name, description, status, category_id })
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.status === "success") {
       
            localStorage.setItem('globalAlertMessage',"Sub Category Data Updated");
            localStorage.setItem('globalAlertType', 'success');
            window.location.href = "SubCategories.html";
          } else {
        
                        localStorage.setItem('globalAlertMessage',"Error updating Sub Category");
localStorage.setItem('globalAlertType', 'danger');
          }
        })
        .catch((err) => {
          console.error("Error:", err);
     
localStorage.setItem('globalAlertMessage',"Failed to submit data.");
localStorage.setItem('globalAlertType', 'danger');
        });
    });

    // Populate category dropdown
    fetch(`${BASEURL}Category`)
      .then(response => response.json())
      .then(data => {
        const select = document.getElementById("category_id");
        select.innerHTML = '<option value="">Select Category</option>';
        if (data.Category && data.Category.length > 0) {
          data.Category.forEach(category => {
            const option = `<option value="${category.id}">${category.name}</option>`;
            select.insertAdjacentHTML('beforeend', option);
          });
        } else {
          select.innerHTML = '<option value="">No categories found</option>';
        }
      })
      .catch(error => {
        console.error('Error fetching category data:', error);
      });
  </script>
</body>
</html>

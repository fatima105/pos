<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Unit</title>

    <link href="scripts/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>

      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-gray">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Edit Unit</h4>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none"
                    >Home</a
                  >
                </li>
                <li class="breadcrumb-item">
                  <a href="units.html" class="text-primary text-decoration-none"
                    >Units</a
                  >
                </li>
                <li
                  class="breadcrumb-item active text-muted"
                  aria-current="page"
                >
                  Edit
                </li>
              </ol>
            </nav>
          </div>

          <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <div style="margin-top: 10px" class="d-flex justify-content-center">
            <div
              class="card py-3 px-3 shadow-lg bg-white"
              style="width: 80%; max-width: 500px"
            >
              <form action="" id="UnitUpdate">
                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold"
                      >Unit Name
                      <span class="text-danger fw-bold">*</span></label
                    >
                    <input
                      id="unitid"
                      value=""
                      type="hidden"
                      class="form-control"
                      required
                    />

                    <input
                      id="name"
                      type="text"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold"
                      >Status <span class="text-danger fw-bold">*</span></label
                    >
                    <select id="status" class="form-select">
                      <option>Active</option>
                      <option>Block</option>
                    </select>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
          </div>
        </div>
        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>
    <!-- Error Modal -->
    <div
      class="modal fade"
      id="ErrorModal"
      tabindex="-1"
      aria-labelledby="ErrorModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-danger" id="ErrorModalLabel">
              <i class="fa-solid fa-triangle-exclamation text-danger"></i>
              Please check your errors
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Okay
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
  <script src="scripts/jquery-3.6.0.min.js"></script>
 <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="scripts/scripts.js"></script>
    <script src="scripts/sweetalert.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Load Footer
        fetch("scripts/footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer-container").innerHTML = data;
            document.getElementById("year").textContent =
              new Date().getFullYear();
          })
          .catch((error) => console.error("Error loading footer:", error));

        // Load Sidebar
        fetch("sidebar.html")
          .then((response) => response.text())
          .then(
            (html) =>
              (document.getElementById("sidebar-container").innerHTML = html)
          );
      });


  document.addEventListener("DOMContentLoaded", () => {
    // This function extracts query parameters from the URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const unitId = getQueryParam("id");
    console.log("Unit ID:", unitId);

    // ✅ Now safe to access DOM
    document.getElementById("unitid").value = unitId;

    if (unitId) {
      const apiUrl = `${BASEURL}unit/${unitId}`;

      fetch(apiUrl)
        .then((res) => {
          if (!res.ok) {
            throw new Error("Network response was not ok");
          }
          return res.json();
        })
        .then((data) => {
          if (data && typeof data === "object") {
            const { name, status } = data;

            document.getElementById("name").value = name;
            document.getElementById("status").value = status;

            sendDataToAnotherApi(name, status);
          } else {
            throw new Error("Invalid data format");
          }
        })
        .catch((err) => {
          console.error("Error fetching unit data:", err);
        });
    } else {
      console.log("No unit ID found in the URL.");
    }

    // Update Unit
    const UnitUpdate = document.getElementById("UnitUpdate");

    UnitUpdate.addEventListener("submit", (e) => {
      e.preventDefault();
      const unitid = document.getElementById("unitid").value;
      const name = document.getElementById("name").value.trim();
      const status = document.getElementById("status").value;

      if (name === "" || status === "") {
        const errorModal = new bootstrap.Modal(
          document.getElementById("ErrorModal")
        );
        errorModal.show();
      } else {
        const apiUrl = `${BASEURL}Unit`;

        fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ name, status, id: unitid }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status == "true") {
                                localStorage.setItem('globalAlertMessage',"Unit Data Updating");
localStorage.setItem('globalAlertType', 'success');
             
              window.location.href = "units.html"; // redirect
            } else {
            
                                  localStorage.setItem('globalAlertMessage',"Error updating unit");
localStorage.setItem('globalAlertType', 'danger');
            }
          })
          .catch((err) => {
            console.error("Error:", err);
                               localStorage.setItem('globalAlertMessage',"Failed to Update Unit");
localStorage.setItem('globalAlertType', 'danger');
          });
      }
    });
  });
</script>
</script>
    <script src="scripts/sweetalert.min.js"></script>
  </body>
</html>

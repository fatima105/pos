<script>
  function showInlineAlert(message, type = 'info') {
  const alertPlaceholder = document.getElementById('alertPlaceholder');
  const alertHTML = `
    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${message}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  `;
  alertPlaceholder.innerHTML = alertHTML;

  // Optional: Auto-dismiss after 5 seconds
  setTimeout(() => {
    const alert = alertPlaceholder.querySelector('.alert');
    if (alert) alert.classList.remove('show');
  }, 5000);
}

  async function loadExpenses() {
    const url = `${BASEURL}expenses`;

    try {
      const response = await fetch(url, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const result = await response.json();
      console.log("API Response:", result);

      // Clear previous data
      ExpenseTable.clear();

      const expenses = Array.isArray(result.data) ? result.data : [];

      expenses.forEach(exp => {
        ExpenseTable.row.add([
          exp.voucher_no || "",
          exp.date ? new Date(exp.date).toLocaleDateString() : "",
         exp.remarks, 
        exp.amount, 
          exp.paid_from || "",
          exp.user_id || "",
          `
            <div class="d-flex gap-2">
            <a href="specific-voucher.html?id=${exp.id}" class="btn btn-sm">
                <i class="fas fa-eye" style="color:blue;"></i>
              </a>
          
            </div>
          `
        ]);
      });

      ExpenseTable.draw();

    } catch (error) {
      console.error("Error fetching expenses:", error);
      document.getElementById("expense-body").innerHTML =
        '<tr><td colspan="7" class="text-center text-danger">Failed to load data. Check console for details.</td></tr>';
    }
  }

  document.addEventListener("DOMContentLoaded", async function () {
    // Load Footer
    fetch("scripts/footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("footer-container").innerHTML = html;
        document.getElementById("year").textContent = new Date().getFullYear();
      });

    // Load Sidebar
 try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
      const sidebarContainer = document.getElementById("sidebar-container");
      sidebarContainer.innerHTML = sidebarHTML;

      // Load sidebar script AFTER sidebar is inserted
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js"; // Ensure initSidebar() exists there
      sidebarScript.onload = function () {
        if (typeof initSidebar === "function") {
          initSidebar(); // Initialize sidebar (user info, links, etc.)
        }
      };
      document.body.appendChild(sidebarScript);
    } catch (error) {
      console.error("Error loading sidebar:", error);
    }

    // Initialize DataTable
    window.ExpenseTable = $("#ExpenseTable").DataTable({
      dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
      buttons: [
        { extend: "copy", className: "btn btn-sm" },
        { extend: "csv", className: "btn btn-sm" },
        { extend: "excel", className: "btn btn-sm" },
        { extend: "pdf", className: "btn btn-sm" },
        { extend: "print", className: "btn btn-sm" },
      ],
    });

    await loadExpenses();
  });


</script>

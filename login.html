<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminERP Login</title>
    <!-- Bootstrap CSS -->
<!-- Local DataTables CSS -->
<link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
<link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background-color: #e9ecef;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 350px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="card login-card shadow" style="border-top: 3px solid #007bff;">

    <div class="card-header text-center bg-white border-0">
        <h3><strong>Admin</strong><span class="text-primary">ERP</span></h3>
        <hr>
    </div>
    <div class="card-body">
        <p class="text-center">Sign in to start your session</p>
        <form id="loginForm">
            <!-- Email Input -->
            <div class="mb-3 input-group">
                <input type="email" value="admin@gmail.com" class="form-control" id="email" placeholder="Email" required>
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            </div>
            <!-- Password Input -->
            <div class="mb-3 input-group">
                <input type="password" value="password"class="form-control" id="password" placeholder="Password" required>
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            </div>
        
            <div class="d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember Me</label>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </div>
        </form>
        
    
    </div>
<!-- Forgot Password Link -->
<div class="card-footer text-center bg-white border-0">
    <a href="#" style="outline: none; text-decoration: none;" class="text-primary">I forgot my password</a>
</div>

</div>

<!-- Bootstrap Bundle with Popper -->
<script src="scripts/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent traditional form submission

        // Simulating a login check (Replace with real authentication)
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (email === "admin@gmail.com" && password === "password") {
            window.location.href = "index.html"; // Redirect to dashboard
        } else {
            alert("Invalid credentials. Try again.");
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>

    <!-- Bootstrap CSS -->
   <link href="scripts/bootstrap.min.css" rel="stylesheet" />

<!-- Local DataTables CSS -->
<link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
<link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  

    <style>
      /* Background color only for button container */
      .bg-buttons {
        background-color: #6c757d; /* Bootstrap secondary gray */
        color: #e9ecef;
        outline: none !important; /* Ensures no outline */

  border: none !important; /* Removes border */
  box-shadow: none !important; /* Ensures no shadow effect */
      }

      .bg-buttons .btn {
        background-color: #6c757d; /* Bootstrap secondary gray */
        color: #e9ecef;
        outline: none !important; /* Ensures no outline */

  border: none !important; /* Removes border */
  box-shadow: none !important; /* Ensures no shadow effect */
      }


    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="scripts/style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- Sidebar -->
      <div id="sidebar-container"></div>


      <!-- Content Area -->
      <div class="content-container">
        <div class="container-fluid bg-white py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Products</h2>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="index.html" class="text-primary text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item active text-muted" aria-current="page">
                  Products
                </li>
              </ol>
            </nav>
          </div>
   <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

          <div class="card shadow-lg mt-5">
            <div class="container mt-4 mb-4">
              <div class="container mt-3">
                <div class="d-flex justify-content-end">
                  <a href="add-products.html" class="text-decoration-none btn btn-primary btn-sm d-flex align-items-center px-3 py-2">
                    <i class="fa-solid fa-plus me-1"></i> Add Products
                </a>
                
                </div>
                <hr class="mt-2">
            </div>
          
              <table id="ProductTable" class="table table-striped table-bordered mt-5">
                <thead class="table-light text-dark">
                  <tr>
                    <th>Category</th>
                    <th>Sub Category</th>
                    <!-- <th>Description</th> -->
                    <th>Unit</th>
                    <th>Name</th>
             
                    <th>SKU</th>
                    <!-- <th>Tax</th> -->
                    <th>Retail Price</th>
                    <th>Status</th>
                      <th>Available Stock</th>
                        <th>Edit</th>
                  </tr>
                </thead>
              <tbody>

              </tbody>
              </table>
            </div>
          </div>
        </div>


        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>
    <!-- Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this tax record?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
          </div>
        </div>
      </div>
    </div>
    <!-- jQuery -->
    <script src="scripts/jquery-3.6.0.min.js"></script>
   <!-- DataTables -->
 <script src="scripts/jquery.dataTables.min.js"></script>
<script src="scripts/dataTables.buttons.min.js"></script>
<script src="scripts/jszip.min.js"></script>
<script src="scripts/pdfmake.min.js"></script>
<script src="scripts/vfs_fonts.js"></script>
<script src="scripts/buttons.html5.min.js"></script>
<script src="scripts/buttons.print.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>
      <script src="config.js" ></script>
<script  >
  
document.addEventListener("DOMContentLoaded", function () {
  // Load Footer


  // Load Sidebar
  fetch("sidebar.html")
    .then((response) => response.text())
    .then(
      (html) => (document.getElementById("sidebar-container").innerHTML = html)
    );

  const table = $("#ProductTable").DataTable({
    dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
    buttons: [
      { extend: "copy", className: "btn btn-sm" },
      { extend: "csv", className: "btn btn-sm" },
      { extend: "excel", className: "btn btn-sm" },
      { extend: "pdf", className: "btn btn-sm" },
      { extend: "print", className: "btn btn-sm" },
    ],
      order: []  
  });

  // Fetch and display Product data
  fetch(`${BASEURL}Product`)
    .then((response) => response.json())
    .then((data) => {
      const products = Array.isArray(data) ? data : data.Product;
console.log(products);

      products.forEach((product) => {
   table.row.add([
  product.category_name || '',
  product.sub_category_name || '',
  // product.description || '',
  product.unit_name || '',
  product.name || '',
  product.SKU || '',
  // product.tax || '',
  product.retail_price || '-',
  product.status || '',
  `
    <span class="badge ${product.available_products < 1 ? 'bg-danger' : 'bg-success'}">
      ${product.available_products || 0}
    </span>
  `,
  `
    <div class="d-flex gap-2">
      <a href="edit-Product.html?id=${product.id}" class="btn btn-sm">
        <i style="color:blue;" class="fas fa-edit"></i>
      </a>
      <!--
      <button type="button" class="btn btn-sm delete-btn" data-id="${product.id}" data-bs-toggle="modal" data-bs-target="#deleteModal">
        <i style="color:red;" class="fas fa-trash"></i>
      </button>
      -->
    </div>
  `
]).draw(false);

      });
    });
});

</script>
      

      
  </body>
</html>

      <!-- Delete Confirmation Modal without Backdrop -->
      <div
        class="modal fade"
        id="deleteModal"
        data-bs-backdrop="false"
        tabindex="-1"
        aria-labelledby="deleteModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="deleteModalLabel">
                <i class="fa-solid fa-triangle-exclamation text-danger"></i>

                Please confirm to delete this record
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary" id="confirmDelete">
                Yes, I'm Sure
              </button>
              <button
                type="button"
                class="btn btn-danger"
                data-bs-dismiss="modal"
              >
                No, I'm Not
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Content Area -->

 <script src="scripts/jquery.dataTables.min.js"></script>

<script src="config.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        // Load Footer
        fetch("scripts/footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer-container").innerHTML = data;
            document.getElementById("year").textContent =
              new Date().getFullYear();
          })
          .catch((error) => console.error("Error loading footer:", error));

        // Load Sidebar
    try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
      const sidebarContainer = document.getElementById("sidebar-container");
            $("#sidebar-container").html(sidebarHTML);

      // Load sidebar script AFTER sidebar is inserted
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js"; // Ensure initSidebar() exists there
      sidebarScript.onload = function () {
        if (typeof initSidebar === "function") {
          initSidebar(); // Initialize sidebar (user info, links, etc.)
        }
      };
      document.body.appendChild(sidebarScript);
    } catch (error) {
      console.error("Error loading sidebar:", error);
    }
        // Initialize DataTable with buttons inside bg-buttons div
        $("#PurchaseViewTable").DataTable({
          dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',

          buttons: [
            { extend: "copy", className: "btn btn-sm" },
            { extend: "csv", className: "btn btn-sm" },
            { extend: "excel", className: "btn btn-sm" },
            { extend: "pdf", className: "btn btn-sm" },
            { extend: "print", className: "btn btn-sm" },
          ],
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        // Select all delete buttons
        document.querySelectorAll(".delete-btn").forEach((button) => {
          button.addEventListener("click", function () {
            let recordId = this.getAttribute("data-id"); // Get record ID

            // Show the modal
            let deleteModal = new bootstrap.Modal(
              document.getElementById("deleteModal")
            );
            deleteModal.show();

            // Handle Delete Confirmation
            document.getElementById("confirmDelete").onclick = function () {
              console.log("Deleted record with ID:", recordId); // Replace with actual delete logic
              deleteModal.hide(); // Hide modal after deletion
            };
          });
        });
      });
    </script>

          }

          products,
          status: "draft"

        await fetch(`${BASEURL}Order/InsertDraft`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyData)
        })

          })

            // Get the table body (assumes your table has a <tbody>)

            console.error("❌ Error:", error);
            showInlineAlert("Something went wrong while adding to draft.", 'danger');

      });

    async function checkOrder(product_id, quantity, qtyInputElement = null, suppressAlert = false) {
      try {
        const res = await fetch(`${BASEURL}Order/OrderCheck`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            product_id: product_id,
            quantity: quantity
          })
        });

        const data = await res.json();
        console.log("OrderCheck:", data);

        if (!res.ok || data.status === false) {
          if (!suppressAlert) {
            showInlineAlert("This product is out of Stock", "danger");
          }

          if (qtyInputElement) {
            const prevQuantity = qtyInputElement.getAttribute('data-last-valid');
            qtyInputElement.value = prevQuantity;
          }

          return { status: false, available: data.available || 0 };
        } else {
          if (qtyInputElement) {
            qtyInputElement.setAttribute('data-last-valid', quantity);
          }

          return { status: true, available: data.available };
        }
      } catch (err) {
        console.error("OrderCheck failed:", err);
        if (qtyInputElement) {
          const prevQuantity = qtyInputElement.getAttribute('data-last-valid') || 1;
          qtyInputElement.value = prevQuantity;
        }
        return { status: false, available: 0 };
      }
    }

  `;

        const alert = alertPlaceholder.querySelector('.alert');
        if (alert) alert.classList.remove('show');
      }, 5000);
    }

    async function submitDraft() {
      const draftName = document.getElementById("draftNameInput").value.trim();
      if (!draftName) {
        showInlineAlert("Please enter a draft name.", 'danger');


        return;
      }

      const bodyData = {
        user_id: 1,
        location_id: 1,
        products: productsToSubmit,
        status: "draft",
        draft_name: draftName
      };

      try {
        const response = await fetch(`${BASEURL}Order/InsertDraft`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyData)
        });

        if (!response.ok) throw new Error("Failed to insert draft");
        await response.json();
        showInlineAlert("No products found", 'success');


        selectedProductIds = [];

        const table = document.getElementById('productTable');

          tbody.innerHTML = '';

    // Function to setup Pay Now button
    function setupPayNowButton() {
      // Add a listener for the Pay Now button which may be added dynamically
      document.addEventListener('click', function (e) {
        if (e.target && e.target.classList.contains('btn') && e.target.textContent === 'Pay Now') {

          const rawTotal = document.getElementById('total').value;

    function matchStart(params, data) {
      if ($.trim(params.term) === '') return data;
      if (typeof data.text === 'undefined') return null;
      if (data.text.toLowerCase().startsWith(params.term.toLowerCase())) return data;
      return null;
    }



    async function loadCustomers() { 
  try {
    const response = await fetch(`${BASEURL}Customer`);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

    const data = await response.json();
    const customerList = data.Customer || [];
    const select = $('#customer_id');

    // Destroy old select2 if exists
    if (select.hasClass("select2-hidden-accessible")) {
      select.select2('destroy');
    }
    select.empty();

    // Optional placeholder
    select.append(new Option('--Choose Customer--', '', false, false));

    // Add customers dynamically
    customerList.forEach(customer => {
      select.append(new Option(customer.name, customer.id, false, false));
    });

    // Initialize Select2
    if ($.fn.select2) {
      select.select2({
        placeholder: '--Choose Customer--',
        allowClear: true,
        dropdownParent: $('#paymentModal'),
        width: 'resolve',
        matcher: matchStart
      });
    }

    // Function to handle Walk-in logic
    function handleCustomerChange(selectedVal) {
      const paymentInput = document.getElementById('payment-amount');
      const amountToPayInput = document.getElementById('payment-to-amount');

      if (selectedVal == 5) { // Walk-in selected
        amountToPayInput.value = paymentInput.value || 0;
        amountToPayInput.readOnly = true;
        console.log(`💰 Walk-in selected → amount-to-pay = ${amountToPayInput.value} (locked)`);
      } else {
        amountToPayInput.readOnly = false;
      }
    }

    // On customer change
    select.on('change', function () {
      handleCustomerChange($(this).val());
    });

    // Extra: keep syncing when Walk-in is selected
    document.getElementById('payment-amount').addEventListener('input', function () {
      if (select.val() == 5) {
        document.getElementById('payment-to-amount').value = this.value || 0;
      }
    });

  } catch (error) {
    console.error('Error fetching Customer data:', error);
  }
}




    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    async function loadProducts() {
      try {
        const response = await fetch(`${BASEURL}Product`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();
        const select = document.getElementById('product_id');
        select.innerHTML = '';

        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '--Choose Product--';
        select.appendChild(defaultOption);

        if (data.Product && data.Product.length > 0) {
          for (const product of data.Product) {
            const option = document.createElement('option');
            option.value = product.id;
            option.textContent = product.name;
            option.setAttribute('data-unit', product.unit_name || 'N/A');

            // 👇 Suppress alert here
            const isAvailable = await checkOrder(product.id, 1, null, true);

            if (!isAvailable) {
              option.disabled = true;
              option.textContent += ' (Out of Stock)';
            }

            select.appendChild(option);
          }
        } else {
          const noProductOption = document.createElement('option');
          noProductOption.disabled = true;
          noProductOption.textContent = 'No Product found';
          select.appendChild(noProductOption);
        }
      } catch (error) {
        console.error('Error fetching Product data:', error);
      }

      async function loadDraftData(sessionId) {
        try {
          const response = await fetch(`${BASEURL}Order/GetOneDraft`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              order_session: sessionId
            })
          });

            // Add Pay Now button after all products are loaded
            addPayNowButtonRow();
          }
        } catch (error) {
          console.error("Error loading draft data:", error);


          localStorage.setItem('globalAlertMessage', "Error loading draft data. Please try again.");

        }

          quantity,

          discount,
          unit_name,
          product_name
        } = draftItem;

        this.value = "";

        if (selectedProductIds.includes(parseInt(selectedId))) {

            const response = await checkOrder(selectedId, 1, quantityInput);
            console.log("OrderCheckCHHCHCHCH:", response);

            // ✅ Correct boolean check (don't compare to 'true' as a string)
            if (response.status) {
              const currentQty = parseInt(quantityInput.value) || 0;
              const newQty = currentQty + 1;

              // Optional: Prevent going over available stock
              if (newQty <= response.available) {
                quantityInput.value = newQty;
                quantityInput.dispatchEvent(new Event('input')); // trigger subtotal recalculation
              } else {
                showInlineAlert(`Only ${response.available} items available.`, 'warning');

              showInlineAlert(`Product out of stock or not available.`, 'danger');
            }

        selectedProductIds.push(parseInt(selectedId));

      <td><input type="number" name="discounts[]" class="form-control unit-discount bg-grey" value="0" min="0" step="0.01" /></td>

    `;

        productRows.appendChild(row);
        this.value = "";

      });
    } function updateTotal() {
      let total = 0;
      let totalProfit = 0;

      document.querySelectorAll("tr").forEach(row => {
        const subtotalInput = row.querySelector(".subtotal");
        const priceInput = row.querySelector(".unit-price");
        const avgPurchaseInput = row.querySelector(".average-purchase-amount");
        const qtyInput = row.querySelector(".quantity");
        const rowProfitInput = row.querySelector(".row-profit"); // Input to show row-wise profit

        if (subtotalInput) {
          const subtotal = parseFloat(subtotalInput.value) || 0;
          total += subtotal;
        }

        if (priceInput && avgPurchaseInput && qtyInput) {
          const price = parseFloat(priceInput.value) || 0;
          const averagePurchase = parseFloat(avgPurchaseInput.value) || 0;
          const qty = parseFloat(qtyInput.value) || 0;
          const profit = (price - averagePurchase) * qty;

          // Update row profit input field
          if (rowProfitInput) {
            // Format the profit value with commas and 2 decimal places
            const formattedProfit = profit.toLocaleString('en-US', {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            });
            rowProfitInput.value = formattedProfit;
          }

          totalProfit += profit;

          console.log("Row Data → Price:", price, "Qty:", qty, "Profit:", profit.toFixed(2));
        }
      });

      const totalFormatted = total.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      const totalProfitFormatted = totalProfit.toFixed(2);

      console.log("Total:", totalFormatted);
      console.log("Total Profit:", totalProfitFormatted);

      const totalInput = document.getElementById('total');
      console.log("value" + totalInput.value);
      if (totalInput) {
        totalInput.value = totalFormatted;
      }

      const modalTotalElement = document.getElementById("modal-total");
      if (modalTotalElement) {
        modalTotalElement.textContent = totalFormatted;
      }

      const paymentInput = document.getElementById("payment-amount");
      if (paymentInput) {
        paymentInput.value = totalFormatted;
      }
      const paymentProfit = document.getElementById("payment-profit-amount");
      if (paymentProfit) {
        paymentProfit.value = totalProfitFormatted;
      }
      const profitElement = document.getElementById("total-profit");
      if (profitElement) {
        profitElement.value = totalProfitFormatted;
      }
    }


    document.getElementById('clearAll').addEventListener('click', function () {
      console.log("afterclear" + selectedProductIds); // Clear the selectedProductIds array
      selectedProductIds = [];


      // Get the table body (assumes your table has a <tbody>)
      const table = document.getElementById('productTable');
      const tbody = table.querySelector('tbody');

      // Clear all rows in the tbody
      if (tbody) {
        tbody.innerHTML = '';
      } else {
        // If there's no <tbody>, remove all rows except header
        const rows = table.querySelectorAll('tr');
        rows.forEach((row, index) => {
          if (index !== 0) row.remove(); // keep the first row (header)
        });
      }

      // Update totals or any other UI if needed
      updateTotal();
    });

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash Payment Details</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="scripts/style.css" />
</head>
<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-white py-3">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="mb-0">Cash Payment Details</h2>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Home</a></li>
              <li class="breadcrumb-item"><a href="cash-payment-voucher.html" class="text-primary text-decoration-none">Cash Payment</a></li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Details</li>
            </ol>
          </nav>
        </div>

        <div class="card shadow-lg mt-5">
          <div class="container mt-4 mb-4">
            <hr class="mt-4" />

            <!-- PDF Button -->
            <div class="d-flex justify-content-end mb-3">
              <button id="pdfExportBtn" class="btn btn-danger btn-sm d-flex align-items-center">
                <i class="fas fa-file-pdf fa-2x me-2"></i>
              </button>
            </div>

            <!-- Table -->
            <table id="CashPaymentDetailsTable" class="table table-striped table-bordered mt-3">
              <thead class="table-light text-dark">
                <tr>
                  <th>Voucher No</th>
                  <th>Date</th>
                  <th>Remarks</th>
                  <th>Paid To</th>
                  <th>Amount</th>
                  <th>Paid From</th>
                  <th>Added By</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Footer -->
     
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/pdfmake.min.js"></script>
  <script src="scripts/vfs_fonts.js"></script>
  <script src="scripts/style.js"></script>
  <script src="config.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<script>
  document.addEventListener("DOMContentLoaded",async function () {
    // Load Sidebar
    try {
      const sidebarResponse = await fetch("sidebar.html");
      const sidebarHTML = await sidebarResponse.text();
 $("#sidebar-container").html(sidebarHTML);


      // Load sidebar script dynamically
      const sidebarScript = document.createElement("script");
      sidebarScript.src = "scripts/scripts.js";
      sidebarScript.onload = () => {
        if (typeof initSidebar === "function") initSidebar();
      };
      document.body.appendChild(sidebarScript);
    } catch (err) {
      console.error("Error loading sidebar:", err);
    }
    // Load Footer
  

    function getQueryParam(param) {
      return new URLSearchParams(window.location.search).get(param);
    }

    const CashPaymentID = getQueryParam("id");
    let totalAmount = 0;
    let voucherNo = "";
    let rows = [];

    if (CashPaymentID) {
      fetch(`${BASEURL}CashPayment/${CashPaymentID}`)
        .then((res) => res.json())
        .then((response) => {
          rows = response.data;

          rows.forEach((item) => {
            totalAmount += parseFloat(item.amount || 0);
            voucherNo = item.voucher_no;

            // Add rows to HTML table
            $("#CashPaymentDetailsTable tbody").append(`
              <tr>
                <td>${item.voucher_no || ""}</td>
                <td>${item.date || ""}</td>
                <td>${item.remarks || ""}</td>
                <td>${item.supplier_name || ""}</td>
                <td>${item.amount || ""}</td>
                <td>${item.paid_from || ""}</td>
                <td>${item.user_id || ""}</td>
              </tr>
            `);
          });

          // Add total row
          $("#CashPaymentDetailsTable tbody").append(`
            <tr>
              <td colspan="4" class="text-end fw-bold">Total:</td>
              <td class="fw-bold">${totalAmount.toLocaleString()}/-</td>
              <td></td>
              <td></td>
            </tr>
          `);

          // PDF Export (Voucher Style)
          document.getElementById("pdfExportBtn").addEventListener("click", () => {
            if (!voucherNo) voucherNo = "Voucher";

            const bodyRows = rows.map(item => [
              item.remarks || "",
              item.paid_from || "",
              item.supplier_name || "",
              item.amount || 0
            ]);

            // Add total row
            bodyRows.push([
              { text: "Total:", colSpan: 3, alignment: "right", bold: true }, {}, {},
              { text: totalAmount.toLocaleString() + "/-", bold: true }
            ]);

            const docDefinition = {
              content: [
                { text: "Cash Payment Voucher", style: "header", alignment: "center", margin: [0,0,0,10] },
                { text: `Voucher# : ${voucherNo}`, margin: [0,0,0,5] },
                { text: `Date : ${rows[0].date}`, margin: [0,0,0,5] },
                { text: `Added By : ${rows[0].user_id}`, margin: [0,0,0,15] },

                {
                  table: {
                    headerRows: 1,
                    widths: ["*", "*", "*", "auto"],
                    body: [
                      ["Remarks", "Paid From", "Paid To", "Amount"],
                      ...bodyRows
                    ]
                  },
                  margin: [0,0,0,30]
                },

                {
                  columns: [
                    { text: "____________________\nPrepared By", alignment: "center" },
                    { text: "____________________\nApproved By", alignment: "center" }
                  ]
                }
              ],

              styles: {
                header: {
                  fontSize: 16,
                  bold: true
                }
              },

              pageMargins: [40, 40, 40, 80]
            };

            pdfMake.createPdf(docDefinition).download(`${voucherNo}.pdf`);
          });
        })
        .catch((err) => console.error("Error fetching details:", err));
    }
  });
</script>
</body>
</html>

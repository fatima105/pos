<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />

  <style>
    .bg-buttons {
      background-color: #6c757d;
      color: #e9ecef;
    }
    .bg-buttons .btn {
      background-color: #6c757d;
      color: #e9ecef;
      border: none !important;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-white py-3">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="mb-0">Expense Details</h2>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Home</a></li>
              <li class="breadcrumb-item"><a href="expense-voucher.html" class="text-primary text-decoration-none">Expenses</a></li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Details</li>
            </ol>
          </nav>
        </div>

        <div class="card shadow-lg mt-5">
          <div class="container mt-4 mb-4">
            <hr class="mt-4" />
            <!-- Table -->
          <div class="d-flex justify-content-end mb-3">
  <button id="pdfExportBtn" class="btn btn-danger btn-sm d-flex align-items-center">
    <i class="fas fa-file-pdf fa-2x me-2"></i>
  </button>
</div>
            <table id="ExpensesTable" class="table table-striped table-bordered mt-3">
              <thead class="table-light text-dark">
                <tr>
                  <th>Voucher No</th>
                  <th>Date</th>
                  <th>Remarks</th>
                  <th>Amount</th>
                  <th>Paid From</th>
                  <th>Added By</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Footer -->
        <!-- <div id="footer-container"></div> -->
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/jquery.dataTables.min.js"></script>
  <script src="scripts/dataTables.buttons.min.js"></script>
  <script src="scripts/jszip.min.js"></script>
  <script src="scripts/pdfmake.min.js"></script>
  <script src="scripts/vfs_fonts.js"></script>
  <script src="scripts/buttons.html5.min.js"></script>
  <script src="scripts/buttons.print.min.js"></script>
  <script src="scripts/style.js"></script>
  <script src="config.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Load Sidebar
    fetch("sidebar.html")
      .then((res) => res.text())
      .then((html) => (document.getElementById("sidebar-container").innerHTML = html));

    // // Load Footer
    // fetch("scripts/footer.html")
    //   .then((res) => res.text())
    //   .then((data) => {
    //     document.getElementById("footer-container").innerHTML = data;
    //     document.getElementById("year").textContent = new Date().getFullYear();
    //   });

    function getQueryParam(param) {
      return new URLSearchParams(window.location.search).get(param);
    }

    const ExpensesID = getQueryParam("id");
    let totalAmount = 0;
    let voucherNo = "";

    const table = $("#ExpensesTable").DataTable({
      paging: false,
      searching: false,
      info: false,
    });

    if (ExpensesID) {
      fetch(`${BASEURL}expenses/${ExpensesID}`)
        .then((res) => res.json())
        .then((response) => {
          const rows = response.data;

          rows.forEach((item) => {
            const amount = parseFloat(item.amount || 0);
            totalAmount += amount;

            voucherNo = item.voucher_no; // save voucher no for filename

            table.row.add([
              item.voucher_no || "",
              item.date || "",
              item.remarks || "",
              amount.toLocaleString(),
              item.paid_from || "",
              item.user_id || "",
            ]);
          });

          table.draw();

          // Add total row
          $("#ExpensesTable tbody").append(`
            <tr>
              <td colspan="3" class="text-end fw-bold">Total:</td>
              <td class="fw-bold">${totalAmount.toLocaleString()}/-</td>
              <td></td>
              <td></td>
            </tr>
          `);

          // PDF Export Custom Design
          document.getElementById("pdfExportBtn").addEventListener("click", () => {
            if (!voucherNo) voucherNo = "Voucher";

            const docDefinition = {
              content: [
                { text: `Voucher# : ${voucherNo}`, bold: true, margin: [0, 0, 0, 5] },
                { text: `Date : ${rows[0].date}`, margin: [0, 0, 0, 5] },
                { text: `Added By : ${rows[0].user_id}`, margin: [0, 0, 0, 15] },

                {
                  table: {
                    widths: ["*", "*", "*"],
                    body: [
                      ["Remarks", "Paid From", "Amount"],
                      [rows[0].remarks, rows[0].paid_from, rows[0].amount],
                      [{ text: "Total:", colSpan: 2, alignment: "right" }, {}, totalAmount + "/-"],
                    ],
                  },
                  margin: [0, 0, 0, 40],
                },

                {
                  columns: [
                    { text: "____________________\nPrepared By", alignment: "center" },
                    { text: "____________________\nApproved By", alignment: "center" },
                  ],
                },
              ],
            };

            pdfMake.createPdf(docDefinition).download(`${voucherNo}.pdf`);
          });
        })
        .catch((err) => console.error("Error fetching expense details:", err));
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchases</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />

  <style>
    .bg-buttons {
      background-color: #6c757d;
      color: #e9ecef;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    .bg-buttons .btn {
      background-color: #6c757d;
      color: #e9ecef;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
</head>

<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>



    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-white py-3">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="mb-0">Purchase Details</h2>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Home</a></li>
              <li class="breadcrumb-item"><a href="view-purchases.html" class="text-primary text-decoration-none">Purchases</a></li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Purchase Details</li>
            </ol>
          </nav>
        </div>

        <div class="card shadow-lg mt-5">
          <div class="container mt-4 mb-4">
            <div class="row">
              <!-- Left -->
              <div class="col-md-6">
                <div><label class="fw-bold">Voucher:</label><div id="voucher_no"></div></div>
                <div><label class="fw-bold">#:</label><div id="ref_no"></div></div>
                <div class="mt-3"><label class="fw-bold">Date:</label><div id="date"></div></div>
              </div>

              <!-- Right -->
              <div class="col-md-6 text-end">
                <div><label class="fw-bold">Supplier:</label><div id="supplier_name"></div></div>
                <div class="mt-3"><label class="fw-bold">Invoice#:</label><div id="invoice_no"></div></div>
              </div>
            </div>

            <hr class="mt-4" />

            <!-- Table -->
            <table id="PurchaseTable" class="table table-striped table-bordered mt-3">
              <thead class="table-light text-dark">
                <tr>
                  <th>Product</th>
                  <th>Unit Price</th>
                  <th>Quantity</th>
                  <th>Total Amount</th>
                  <th>Barcode</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Footer -->
        <div id="footer-container"></div>
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/jquery.dataTables.min.js"></script>
  <script src="scripts/dataTables.buttons.min.js"></script>
  <script src="scripts/jszip.min.js"></script>
  <script src="scripts/pdfmake.min.js"></script>
  <script src="scripts/vfs_fonts.js"></script>
  <script src="scripts/buttons.html5.min.js"></script>
  <script src="scripts/buttons.print.min.js"></script>
  <script src="scripts/style.js"></script>
  <script src="config.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Sidebar
      fetch("sidebar.html")
        .then((res) => res.text())
        .then((html) => document.getElementById("sidebar-container").innerHTML = html);

      // Footer
      fetch("scripts/footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer-container").innerHTML = data;
          document.getElementById("year").textContent = new Date().getFullYear();
        });

      // Helper
      function getQueryParam(param) {
        return new URLSearchParams(window.location.search).get(param);
      }

      const purchaseId = getQueryParam('id');
      const table = $('#PurchaseTable').DataTable({
        dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
        buttons: [
          { extend: "copy", className: "btn btn-sm" },
          { extend: "csv", className: "btn btn-sm" },
          { extend: "excel", className: "btn btn-sm" },
          { extend: "pdf", className: "btn btn-sm" },
          { extend: "print", className: "btn btn-sm" }
        ]
      });

      if (purchaseId) {
        // Basic Info
        fetch(`${BASEURL}Purchase/${purchaseId}`)
          .then(res => res.json())
          .then(data => {
            const { invoice_no, voucher_no, purchase_date, supplier_name } = data;
            document.getElementById("invoice_no").textContent = invoice_no || '';
            document.getElementById("voucher_no").textContent = voucher_no || '';
            document.getElementById("supplier_name").textContent = supplier_name || '';
            document.getElementById("date").textContent = (purchase_date || '').split('T')[0];
          })
          .catch(err => console.error("Error fetching header:", err));

        // Detail Table
        fetch(`${BASEURL}Purchase/Detail/${purchaseId}`)
          .then(res => res.json())
          .then(data => {
            const rows = data.PurchaseDetail || [];
            table.clear();

            rows.forEach(item => {
              table.row.add([
                item.product_name || '',
                item.retail_price || '',
                item.quantity || '',
                (item.retail_price * item.quantity).toFixed(2),
                item.barcode || '',
                '' // Action column (optional)
              ]);
            });

            table.draw();
          })
          .catch(err => {
            console.error("❌ Error loading details:", err);
            table.clear().draw();
          });
      }
    });
  </script>
</body>
</html>

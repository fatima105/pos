<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <!-- DataTables CSS -->
<!-- Local DataTables CSS -->
<link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
<link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  
  <style>
    .bg-buttons {
      background-color: #6c757d;
      color: #e9ecef;
      border: none !important;
      box-shadow: none !important;
    }

    .bg-buttons .btn {
      background-color: #6c757d;
      color: #e9ecef;
      border: none !important;
      box-shadow: none !important;
    }

    @media (max-width: 768px) {
      .d-flex.justify-content-end {
        justify-content: center !important;
        flex-direction: column;
        align-items: center;
      }

      .d-flex.justify-content-end .btn {
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />
</head>

<body>
<div class="main-container">
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Content Area -->
  <div class="content-container">
    <div class="container-fluid bg-white py-3">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
        <h2 class="mb-3 mb-md-0">Customers</h2>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
              <a href="index.html" class="text-primary text-decoration-none">Home</a>
            </li>
            <li class="breadcrumb-item active text-muted" aria-current="page">Customers</li>
          </ol>
        </nav>
      </div>
     <div id="alertPlaceholder" class="position-fixed top-0 start-50 translate-middle-x mt-4" style="z-index: 1055; width: 400px; max-width: 90%;"></div>

      <div class="card shadow-lg mt-4">
        <div class="card-body">
          <div class="mb-3 text-end">
            <a href="add-customer.html" class="btn btn-primary btn-sm d-inline-flex align-items-center px-3 py-2">
              <i class="fa-solid fa-plus me-1"></i> Add Customer
            </a>
          </div>

          <div class="table-responsive">
            <table id="customerTable" class="table table-striped table-bordered w-100">
              <thead class="table-light text-dark">
                <tr>
                  <!-- <th>No</th> -->
                  <th>Name</th>
                  <th>Company</th>
                  <th>CNIC</th>
                  <th>Email</th>
                  <th>Mobile</th>
                  <th>Land Line</th>
                  <!-- <th>City</th> -->
                  <!-- <th>Status</th> -->
                  <th>Credit Limit</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="customerTableBody">
                <!-- Customer data will be populated here dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>
  </div>
</div>


  <!-- JS Dependencies -->
    <!-- jQuery -->
    <script src="scripts/jquery-3.6.0.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>
 <script src="scripts/jquery.dataTables.min.js"></script>
<script src="scripts/dataTables.buttons.min.js"></script>
<script src="scripts/jszip.min.js"></script>
<script src="scripts/pdfmake.min.js"></script>
<script src="scripts/vfs_fonts.js"></script>
<script src="scripts/buttons.html5.min.js"></script>
<script src="scripts/buttons.print.min.js"></script>
 <script src="config.js"></script>
  <!-- Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
            function showInlineAlert(message, type = 'info') {
        const alertPlaceholder = document.getElementById('alertPlaceholder');
        const alertHTML = `
          <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
        alertPlaceholder.innerHTML = alertHTML;

        setTimeout(() => {
          const alert = alertPlaceholder.querySelector('.alert');
          if (alert) alert.classList.remove('show');
        }, 5000);
      }
      // Load footer and sidebar
      fetch("scripts/footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer-container").innerHTML = data;
          document.getElementById("year").textContent = new Date().getFullYear();
        });

      fetch("sidebar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("sidebar-container").innerHTML = data;
        });

      // Load Customers
      loadCustomers();
    });

    async function loadCustomers() {
      try {
        const response = await fetch(`${BASEURL}Customer`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        const tbody = document.getElementById("customerTableBody");
        tbody.innerHTML = "";

        if (data.Customer && data.Customer.length > 0) {
          data.Customer.forEach((customer, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
          
              <td>${customer.name}</td>
              <td>${customer.company}</td>
              <td>${customer.cnic}</td>
              <td>${customer.email}</td>
              <td>${customer.mobile}</td>
              <td>${customer.land_line}</td>
         
              <td>${customer.credit_limit}</td>
              <td>
       
                      <div class="d-flex gap-2">
                        <a href="edit-customer.html?id=${customer.id}" class="btn btn-sm">
                          <i style="color:blue;" class="fas fa-edit"></i>
                        </a>
                        <!-- DELETE BUTTON -->
                    
                      </div>
             
              </td>
            `;
            tbody.appendChild(row);
          });

          // Initialize DataTable AFTER data is loaded and once only
          $('#customerTable').DataTable({
            responsive: true,
            destroy: true, // Allow reinitialization
            dom: '<"d-flex justify-content-between align-items-center flex-wrap mb-2"<"bg-buttons"B>f>rtip',
            buttons: [
              { extend: 'copy', className: 'btn btn-sm' },
              { extend: 'csv', className: 'btn btn-sm' },
              { extend: 'excel', className: 'btn btn-sm' },
              { extend: 'pdf', className: 'btn btn-sm' },
              { extend: 'print', className: 'btn btn-sm' }
            ],
              order: []  
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="11" class="text-center">No customer data found</td></tr>`;
        }
      } catch (error) {
        console.error("Error fetching Customer data:", error);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Return</title>

  <!-- Bootstrap CSS -->
  <link href="scripts/bootstrap.min.css" rel="stylesheet" />
  <!-- DataTables CSS -->
<!-- Local DataTables CSS -->
<link rel="stylesheet" href="scripts/jquery.dataTables.min.css" />
<link rel="stylesheet" href="scripts/buttons.dataTables.min.css" />
  
  <style>
    .bg-buttons {
      background-color: #6c757d;
      color: #e9ecef;
      border: none !important;
      box-shadow: none !important;
    }

    .bg-buttons .btn {
      background-color: #6c757d;
      color: #e9ecef;
      border: none !important;
      box-shadow: none !important;
    }

    @media (max-width: 768px) {
      .d-flex.justify-content-end {
        justify-content: center !important;
        flex-direction: column;
        align-items: center;
      }

      .d-flex.justify-content-end .btn {
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="scripts/style.css" />
</head>

<body>
  <div class="main-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content Area -->
    <div class="content-container">
      <div class="container-fluid bg-white py-3">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
          <h2 class="mb-3 mb-md-0">Sale Return</h2>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="index.html" class="text-primary text-decoration-none">Home </a>
              </li>
              <li class="breadcrumb-item active text-muted" aria-current="page">Sale Return</li>
            </ol>
          </nav>
        </div>

        <div class="card shadow-lg mt-4">
          <div class="card-body">
         

            <div class="table-responsive">
              <table id="saleTable" class="table table-striped table-bordered w-100">
                <thead class="table-light text-dark">
                  <tr>
                    <th>Code</th>
                    <th>Customer</th>
                    <th>Sale</th>
                 
                    <th>Sale Date</th>
                       <th>Amount</th>
                    <th>Return Date</th>
                    <th>Added By</th>
              
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="saleReturnTableBody">
                  <!-- Data will populate here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div id="footer-container"></div>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="scripts/jquery-3.6.0.min.js"></script>
 <script src="scripts/jquery.dataTables.min.js"></script>
<script src="scripts/dataTables.buttons.min.js"></script>
<script src="scripts/jszip.min.js"></script>
<script src="scripts/pdfmake.min.js"></script>
<script src="scripts/vfs_fonts.js"></script>
<script src="scripts/buttons.html5.min.js"></script>
<script src="scripts/buttons.print.min.js"></script>   <!-- jQuery -->

    <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
  <!-- Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Load footer and sidebar
      fetch("scripts/footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer-container").innerHTML = data;
          document.getElementById("year").textContent = new Date().getFullYear();
        });

      fetch("sidebar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("sidebar-container").innerHTML = data;
        });

      // Load Sales
      loadSales();
    });

    async function loadSales() {
      try {
        const response = await fetch(`${BASEURL}SaleReturn`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        const tbody = document.getElementById("saleReturnTableBody");
        tbody.innerHTML = "";

        if ( data.length > 0) {
            // Sort by ID in descending order
  data.sort((a, b) => b.id - a.id);

          data.forEach((Sale, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
          
              <td>${Sale.voucher_no}</td>
              <td>${Sale.customer_name}</td>
                    <td>SV+${Sale.sale_date}</td>
                   <td>${Sale.sale_date}</td>
                      <td>${Sale.amount}</td>
                        <td>${Sale.sale_return_date}</td>
                          
                     
            <td>${Sale.user_id}</td>
        
              <td>
<!-- Icons -->
<a href="view-specific-sale-return-details.html?id=${Sale.id}"><i class="fas fa-eye" style="color:#0084ff;"></i></a>

              </td>
            `;
            tbody.appendChild(row);
          });

          // Initialize DataTable AFTER data is loaded and once only
          $('#saleTable').DataTable({
            responsive: true,
            destroy: true, // Allow reinitialization
                     dom: '<"d-flex justify-content-between align-items-center"<"bg-buttons"B>f>rtip',
            buttons: [
              { extend: 'copy', className: 'btn btn-sm' },
              { extend: 'csv', className: 'btn btn-sm' },
              { extend: 'excel', className: 'btn btn-sm' },
              { extend: 'pdf', className: 'btn btn-sm' },
              { extend: 'print', className: 'btn btn-sm' }
            ],
              order: []  
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="11" class="text-center">No Sale data found</td></tr>`;
        }
      } catch (error) {
        console.error("Error fetching Sale data:", error);
      }
    }
  </script>
</body>
</html>
